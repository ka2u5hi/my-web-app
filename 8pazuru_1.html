<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8パズル の しれん</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'DotGothic16', monospace;
      background-color: #000;
      color: #fff;
      image-rendering: pixelated;
      user-select: none;
    }

    .dq-window {
      background-color: #000;
      border: 4px solid #fff;
      border-radius: 6px;
      box-shadow: inset 0 0 0 2px #000, 0 4px 10px rgba(0, 0, 0, 0.8);
    }

    .dq-button {
      background-color: #000;
      border: 2px solid #fff;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .dq-button:active {
      background-color: #222;
      transform: scale(0.96);
    }

    /* パズルボード (3x3) */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #fff;
      border: 4px solid #fff;
      padding: 4px;
      border-radius: 4px;
    }

    /* タイル */
    .tile {
      background-color: #000;
      color: #fff;
      font-size: 1.8rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid #fff;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.1s;
    }

    .tile.correct {
      border-color: #f59e0b;
      color: #fbbf24;
    }

    .tile.empty {
      background-color: #000;
      border: none;
      cursor: default;
    }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-between">

  <!-- ヘッダー -->
  <header class="w-full max-w-sm flex justify-between items-center mb-2">
    <button onclick="backToQuest()" class="dq-button px-3 py-1.5 text-xs border-yellow-400 text-yellow-300 flex items-center gap-1 font-bold">
      ◀ ぼうけんのしょ に もどる
    </button>
    <span class="text-xs text-gray-400 font-bold">キーワード 1 の しれん</span>
  </header>

  <!-- メインコンテンツ -->
  <main class="w-full max-w-sm text-center my-auto space-y-3">
    <h1 class="text-xl font-bold text-yellow-400">8パズル の しれん</h1>
    <p class="text-xs text-gray-300">すうじを じゅんばんに ならべて<br>パズルを かんせいさせよ！</p>

    <div class="dq-window p-4">
      <!-- ステータス表示 -->
      <div class="flex justify-between items-center mb-3 text-xs border-b border-gray-700 pb-2">
        <span class="text-gray-400">うごかした かず:</span>
        <span id="move-count" class="text-yellow-400 text-base font-bold">0</span>
      </div>

      <!-- パズル盤面 -->
      <div class="board mb-4" id="board"></div>

      <!-- 操作ボタン -->
      <button class="dq-button py-2 px-4 bg-gray-900 border-gray-400 text-xs w-full font-bold" id="reset-btn">
        ↻ シャッフル / やりなおす
      </button>

      <!-- クリアメッセージ -->
      <div id="win-message" class="hidden mt-3 p-2 bg-yellow-950 border-2 border-yellow-400 text-yellow-300 text-xs font-bold animate-pulse">
        🎉 おめでとう！ パズルを かんせいさせた！
      </div>
    </div>
  </main>

  <footer class="text-[10px] text-gray-500 mt-2">
    Quest of R - Mini Game
  </footer>

  <script>
    const GRID_SIZE = 3;
    let tiles = [];
    let moves = 0;
    let isGameActive = false;

    const boardElement = document.getElementById('board');
    const moveCountElement = document.getElementById('move-count');
    const winMessageElement = document.getElementById('win-message');
    const resetBtn = document.getElementById('reset-btn');

    function backToQuest() {
      window.location.href = "https://ka2u5hi.github.io/my-web-app/mainadmini.html";
    }

    function initGame() {
      tiles = Array.from({ length: GRID_SIZE * GRID_SIZE }, (_, i) => (i + 1) % (GRID_SIZE * GRID_SIZE));
      moves = 0;
      isGameActive = true;
      updateMovesDisplay();
      winMessageElement.classList.add('hidden');
      shuffleTiles();
      renderBoard();
    }

    function shuffleTiles() {
      const shuffleSteps = 120;
      for (let i = 0; i < shuffleSteps; i++) {
        const emptyIndex = tiles.indexOf(0);
        const validMoves = getValidMoves(emptyIndex);
        const randomMove = validMoves[Math.floor(Math.random() * validMoves.length)];
        [tiles[emptyIndex], tiles[randomMove]] = [tiles[randomMove], tiles[emptyIndex]];
      }
      if (checkWin()) {
        shuffleTiles();
      }
    }

    function getValidMoves(emptyIndex) {
      const row = Math.floor(emptyIndex / GRID_SIZE);
      const col = emptyIndex % GRID_SIZE;
      const validMoves = [];
      if (row > 0) validMoves.push(emptyIndex - GRID_SIZE);
      if (row < GRID_SIZE - 1) validMoves.push(emptyIndex + GRID_SIZE);
      if (col > 0) validMoves.push(emptyIndex - 1);
      if (col < GRID_SIZE - 1) validMoves.push(emptyIndex + 1);
      return validMoves;
    }

    function renderBoard() {
      boardElement.innerHTML = '';
      tiles.forEach((value, index) => {
        const tileElement = document.createElement('div');
        tileElement.classList.add('tile');

        if (value === 0) {
          tileElement.classList.add('empty');
        } else {
          if (value === index + 1) {
            tileElement.classList.add('correct');
          }
          tileElement.textContent = value;
          tileElement.addEventListener('click', () => handleTileClick(index));
        }
        boardElement.appendChild(tileElement);
      });
    }

    function handleTileClick(index) {
      if (!isGameActive) return;
      const emptyIndex = tiles.indexOf(0);
      const validMoves = getValidMoves(emptyIndex);

      if (validMoves.includes(index)) {
        [tiles[emptyIndex], tiles[index]] = [tiles[index], tiles[emptyIndex]];
        moves++;
        updateMovesDisplay();
        renderBoard();

        if (checkWin()) {
          handleWin();
        }
      }
    }

    function checkWin() {
      for (let i = 0; i < tiles.length - 1; i++) {
        if (tiles[i] !== i + 1) return false;
      }
      return tiles[tiles.length - 1] === 0;
    }

    function handleWin() {
      isGameActive = false;
      winMessageElement.classList.remove('hidden');

      setTimeout(() => {
        window.location.href = "https://ka2u5hi.github.io/my-web-app/mainadmini.html?clear_spot=1";
      }, 1200);
    }

    function updateMovesDisplay() {
      moveCountElement.textContent = moves;
    }

    resetBtn.addEventListener('click', initGame);

    window.addEventListener('keydown', (e) => {
      if (!isGameActive) return;
      const emptyIndex = tiles.indexOf(0);
      const row = Math.floor(emptyIndex / GRID_SIZE);
      const col = emptyIndex % GRID_SIZE;
      let targetIndex = -1;

      if (e.key === 'ArrowUp' && row < GRID_SIZE - 1) targetIndex = emptyIndex + GRID_SIZE;
      else if (e.key === 'ArrowDown' && row > 0) targetIndex = emptyIndex - GRID_SIZE;
      else if (e.key === 'ArrowLeft' && col < GRID_SIZE - 1) targetIndex = emptyIndex + 1;
      else if (e.key === 'ArrowRight' && col > 0) targetIndex = emptyIndex - 1;

      if (targetIndex !== -1) handleTileClick(targetIndex);
    });

    window.onload = initGame;
  </script>
</body>
</html>
