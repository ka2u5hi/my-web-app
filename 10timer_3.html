<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10.00秒タイマー の しれん</title>
    <!-- スタイル設計用 Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ドラクエ風ドットフォント -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'DotGothic16', monospace;
            background-color: #000;
            color: #fff;
            image-rendering: pixelated;
            user-select: none;
        }

        .dq-window {
            background-color: #000;
            border: 4px solid #fff;
            border-radius: 6px;
            box-shadow: inset 0 0 0 2px #000, 0 4px 10px rgba(0, 0, 0, 0.8);
        }

        .dq-button {
            background-color: #000;
            border: 2px solid #fff;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .dq-button:active {
            background-color: #222;
            transform: scale(0.96);
        }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-between">

    <!-- ヘッダー -->
    <header class="w-full max-w-sm flex justify-between items-center mb-2">
        <button onclick="backToQuest()" class="dq-button px-3 py-1.5 text-xs border-yellow-400 text-yellow-300 flex items-center gap-1 font-bold">
            ◀ ぼうけんのしょ に もどる
        </button>
        <span class="text-xs text-gray-400 font-bold">キーワード 1 の しれん</span>
    </header>

    <!-- メインコンテンツ -->
    <main class="w-full max-w-sm text-center my-auto space-y-3">
        <h1 class="text-xl font-bold text-yellow-400">10.00秒タイマー の しれん</h1>
        <p class="text-xs text-gray-300">たいないとけい で 10.00びょう を ねらえ！<br>3びょうで すうじが かくれるぞ！</p>

        <!-- ルール説明 -->
        <div class="dq-window p-3 text-left text-xs text-gray-300 space-y-1">
            <p><span class="text-yellow-400 font-bold">【ルール】</span></p>
            <p>・3.00びょうで すうじが かくれます。</p>
            <p>・10.00びょう ジャストで ストップ！</p>
            <p>・<span class="text-green-400 font-bold">ごさ 0.50びょう いない</span> で クリア！</p>
        </div>

        <!-- タイマー表示エリア -->
        <div class="dq-window p-5 text-center relative">
            <div id="blindBadge" class="text-xs px-2 py-0.5 border border-gray-500 inline-block text-gray-300 mb-2">
                たいきちゅう
            </div>

            <!-- 数字表示 -->
            <div id="timerDisplay" class="text-5xl font-bold text-yellow-400 tracking-wider my-2">
                0.00
            </div>

            <div id="statusMessage" class="text-xs text-gray-400">
                ボタンを おして ゲームスタート
            </div>
        </div>

        <!-- アクションボタン -->
        <div class="w-full">
            <button id="actionBtn" onclick="handleAction()" class="dq-button w-full py-3 bg-yellow-500 border-yellow-300 text-black font-bold text-lg">
                スタート！
            </button>
        </div>

        <!-- 結果表示カード -->
        <div id="resultCard" class="dq-window p-3 text-center hidden">
            <div id="clearBadge" class="inline-block px-3 py-1 text-xs font-bold mb-1"></div>
            <div id="evalMessage" class="text-sm font-bold text-white mb-1"></div>
            <div class="text-xs text-gray-300 flex justify-center gap-4">
                <span>きろく: <strong id="resultTime" class="text-yellow-400">--.--</strong> びょう</span>
                <span>ごさ: <strong id="resultDiff" class="text-yellow-400">--</strong> びょう</span>
            </div>
        </div>
    </main>

    <footer class="text-[10px] text-gray-500 mt-2">
        Quest of R - Mini Game
    </footer>

    <script>
        let startTime = 0;
        let timerAnimFrame = null;
        let isRunning = false;
        let isBlind = false;

        const timerDisplay = document.getElementById('timerDisplay');
        const statusMessage = document.getElementById('statusMessage');
        const blindBadge = document.getElementById('blindBadge');
        const actionBtn = document.getElementById('actionBtn');
        const resultCard = document.getElementById('resultCard');
        const clearBadge = document.getElementById('clearBadge');
        const evalMessage = document.getElementById('evalMessage');
        const resultTime = document.getElementById('resultTime');
        const resultDiff = document.getElementById('resultDiff');

        function backToQuest() {
            window.location.href = "https://ka2u5hi.github.io/my-web-app/mainadmini.html";
        }

        function handleAction() {
            if (!isRunning) {
                startGame();
            } else {
                stopGame();
            }
        }

        function updateTimer() {
            if (!isRunning) return;

            const now = performance.now();
            const elapsed = (now - startTime) / 1000;

            if (elapsed >= 3.00 && !isBlind) {
                isBlind = true;
                timerDisplay.textContent = "??.??";
                timerDisplay.className = "text-5xl font-bold text-red-500 tracking-wider my-2 animate-pulse";
                blindBadge.textContent = "🙈 ブラインドちゅう";
                blindBadge.className = "text-xs px-2 py-0.5 border border-red-500 text-red-400 inline-block mb-2";
                statusMessage.textContent = "タイマーが かくれました！";
            } else if (!isBlind) {
                timerDisplay.textContent = elapsed.toFixed(2);
            }

            timerAnimFrame = requestAnimationFrame(updateTimer);
        }

        function startGame() {
            isRunning = true;
            isBlind = false;

            timerDisplay.textContent = "0.00";
            timerDisplay.className = "text-5xl font-bold text-yellow-400 tracking-wider my-2";
            blindBadge.textContent = "👁️ ひょうじちゅう";
            blindBadge.className = "text-xs px-2 py-0.5 border border-yellow-400 text-yellow-300 inline-block mb-2";
            statusMessage.textContent = "3.00びょうを こえると かくれます...";

            resultCard.classList.add('hidden');

            actionBtn.className = "dq-button w-full py-3 bg-red-600 border-red-400 text-white font-bold text-lg";
            actionBtn.textContent = "10.00びょうで ストップ！";

            startTime = performance.now();
            timerAnimFrame = requestAnimationFrame(updateTimer);
        }

        function stopGame() {
            isRunning = false;
            cancelAnimationFrame(timerAnimFrame);

            const stopTime = performance.now();
            const elapsed = (stopTime - startTime) / 1000;
            const diff = elapsed - 10.00;
            const absDiff = Math.abs(diff);

            timerDisplay.textContent = elapsed.toFixed(2);
            timerDisplay.className = "text-5xl font-bold text-white tracking-wider my-2";

            blindBadge.textContent = "はんてい かんりょう";
            blindBadge.className = "text-xs px-2 py-0.5 border border-gray-500 text-gray-300 inline-block mb-2";
            statusMessage.textContent = "チャレンジ しゅうりょう！";

            actionBtn.className = "dq-button w-full py-3 bg-yellow-500 border-yellow-300 text-black font-bold text-lg";
            actionBtn.textContent = "もういちど ちょうせん";

            const isCleared = absDiff <= 0.50;
            let evalText = "";

            if (absDiff === 0) {
                evalText = "🎯 かみわざ！ 10.00びょう ピッタリ！";
            } else if (absDiff <= 0.10) {
                evalText = "✨ すごまじい せいど！";
            } else if (isCleared) {
                evalText = "👍 ナイス かんかく！ クリア！";
            } else {
                evalText = "💸 おしい！ かんかくを とぎすませ！";
            }

            const diffSign = diff >= 0 ? `+${diff.toFixed(2)}` : diff.toFixed(2);

            if (isCleared) {
                clearBadge.textContent = "🎉 CLEAR !! (ごさ 0.5びょう いない)";
                clearBadge.className = "inline-block px-3 py-1 border border-green-400 text-green-300 text-xs font-bold mb-1";
            } else {
                clearBadge.textContent = "❌ GAME OVER (ごさ 0.5びょう ちょう)";
                clearBadge.className = "inline-block px-3 py-1 border border-red-500 text-red-400 text-xs font-bold mb-1";
            }

            evalMessage.textContent = evalText;
            resultTime.textContent = elapsed.toFixed(2);
            resultDiff.textContent = `${diffSign}s`;
            resultCard.classList.remove('hidden');

            if (isCleared) {
                setTimeout(() => {
                    window.location.href = "https://ka2u5hi.github.io/my-web-app/mainadmini.html?clear_spot=1";
                }, 1200);
            }
        }
    </script>
</body>
</html>
