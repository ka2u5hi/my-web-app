<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10.00秒タイマーチャレンジ</title>
    <!-- スタイル設計用 Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- アイコン用 FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: 数字用等幅フォントと日本語フォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .font-mono-num {
            font-family: 'JetBrains Mono', monospace;
        }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-4 sm:p-6">

    <header class="text-center mt-2 sm:mt-4">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-sky-500/10 border border-sky-500/30 text-sky-400 rounded-full text-xs font-semibold mb-2">
            <i class="fa-solid fa-stopwatch"></i> 3秒経過でブラインド化
        </span>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">10.00秒タイマーチャレンジ</h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">最初の3秒を参考に、体内時計で10.00秒を狙え！</p>
    </header>

    <main class="w-full max-w-md my-auto flex flex-col items-center py-4">

        <!-- ルール説明カード -->
        <div class="w-full bg-slate-800/60 border border-slate-700/80 rounded-2xl p-4 mb-4 text-center text-xs text-slate-300">
            <p><span class="text-sky-400 font-bold">【ルール】</span> 3.00秒までタイマーが表示され、その後隠れます。<br>10.00秒ジャストでストップ！<br><span class="text-emerald-400 font-bold">誤差0.50秒以内 (9.50s〜10.50s)</span>でクリア！</p>
        </div>

        <!-- タイマー表示エリア -->
        <div class="w-full bg-slate-800/80 backdrop-blur-md border border-slate-700 rounded-3xl p-6 text-center shadow-xl mb-4 relative overflow-hidden">
            <div id="blindBadge" class="text-xs font-semibold px-2.5 py-0.5 rounded-full inline-block bg-slate-700 text-slate-300 mb-1">
                待機中
            </div>

            <!-- 数字表示（3秒超で ??.?? に変化） -->
            <div id="timerDisplay" class="font-mono-num text-5xl sm:text-6xl font-extrabold text-slate-100 tracking-wider my-3 transition-colors duration-300">
                0.00
            </div>

            <div id="statusMessage" class="text-xs font-medium text-slate-400">
                スタートボタンを押してゲーム開始
            </div>
        </div>

        <!-- アクションボタン（スタート / ストップ） -->
        <div class="w-full mb-4">
            <button id="actionBtn" onclick="handleAction()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-extrabold text-xl shadow-lg transition-all duration-200 active:scale-95 flex items-center justify-center gap-2 cursor-pointer">
                <i id="btnIcon" class="fa-solid fa-play"></i>
                <span id="btnText">スタート</span>
            </button>
        </div>

        <!-- 最新の結果表示カード -->
        <div id="resultCard" class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-4 text-center mb-4 hidden">
            <div id="clearBadge" class="inline-block px-3.5 py-1 rounded-full text-xs font-extrabold mb-2 tracking-wide"></div>
            <div id="evalMessage" class="text-base font-bold text-white mb-2"></div>
            <div class="text-xs text-slate-300 flex justify-center gap-4">
                <span>記録: <strong id="resultTime" class="font-mono-num text-sm text-white">--.--</strong> 秒</span>
                <span>誤差: <strong id="resultDiff" class="font-mono-num text-sm text-white">--</strong> 秒</span>
            </div>
        </div>

        <div class="w-full bg-slate-800/40 border border-slate-700/50 rounded-2xl p-4">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs font-bold text-slate-300 flex items-center gap-1.5 uppercase tracking-wider">
                    <i class="fa-solid fa-clock-rotate-left text-sky-400"></i> 挑戦履歴 (最新10件)
                </h2>
                <button onclick="clearHistory()" class="text-[11px] text-slate-400 hover:text-slate-200 transition-colors">
                    履歴クリア
                </button>
            </div>
            <div id="historyList" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                <!-- 履歴アイテムがここにJSで動的追加される -->
                <p id="emptyHistory" class="text-xs text-slate-500 text-center py-3">まだ履歴がありません</p>
            </div>
        </div>

    </main>

    <!-- フッター -->
    <footer class="text-center text-xs text-slate-500 my-2">
        10.00s Blind Timer Stop Game &bull; Single File App
    </footer>

    <script>
        // ==========================================
        // ゲーム状態の変数定義
        // ==========================================
        let startTime = 0;           // スタート時のタイムスタンプ
        let timerAnimFrame = null;   // アニメーションフレームID
        let isRunning = false;       // ゲーム実行中フラグ
        let isBlind = false;         // 現在ブラインド中かどうか
        let historyData = [];        // 過去の記録配列

        // DOM要素の参照を取得
        const timerDisplay = document.getElementById('timerDisplay');
        const statusMessage = document.getElementById('statusMessage');
        const blindBadge = document.getElementById('blindBadge');
        const actionBtn = document.getElementById('actionBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const resultCard = document.getElementById('resultCard');
        const clearBadge = document.getElementById('clearBadge');
        const evalMessage = document.getElementById('evalMessage');
        const resultTime = document.getElementById('resultTime');
        const resultDiff = document.getElementById('resultDiff');
        const historyList = document.getElementById('historyList');
        const emptyHistory = document.getElementById('emptyHistory');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const now = audioCtx.currentTime;

            if (type === 'start') {
                // スタート音（爽やかな上昇音）
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } else if (type === 'blind') {
                // ブラインド化通知音（低い電子音）
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(350, now);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'clear') {
                // クリアファンファーレ
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.08, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.25);
                });
            } else if (type === 'fail') {
                // 失敗音
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(120, now + 0.25);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            }
        }

        function handleAction() {
            if (!isRunning) {
                startGame();
            } else {
                stopGame();
            }
        }

        // タイマー更新関数（requestAnimationFrameで高精度に実行）
        function updateTimer() {
            if (!isRunning) return;

            const now = performance.now();
            const elapsed = (now - startTime) / 1000;

            // 3.00秒判定：3秒を超えたらブラインド化
            if (elapsed >= 3.00 && !isBlind) {
                isBlind = true;
                playSound('blind');
                timerDisplay.textContent = "??.??";
                timerDisplay.className = "font-mono-num text-5xl sm:text-6xl font-extrabold text-amber-400 tracking-wider my-3 animate-pulse";
                blindBadge.textContent = "🙈 ブラインド中";
                blindBadge.className = "text-xs font-semibold px-2.5 py-0.5 rounded-full inline-block bg-amber-500/20 text-amber-400 border border-amber-500/30 mb-1";
                statusMessage.textContent = "タイマーが隠れました！心の中で10秒数えよう";
                statusMessage.className = "text-xs font-medium text-amber-400";
            } else if (!isBlind) {
                // 3秒未満は数字を表示
                timerDisplay.textContent = elapsed.toFixed(2);
            }

            timerAnimFrame = requestAnimationFrame(updateTimer);
        }

        function startGame() {
            isRunning = true;
            isBlind = false;
            playSound('start');

            // UI状態の初期化
            timerDisplay.textContent = "0.00";
            timerDisplay.className = "font-mono-num text-5xl sm:text-6xl font-extrabold text-sky-400 tracking-wider my-3";
            blindBadge.textContent = "👁️ 表示中";
            blindBadge.className = "text-xs font-semibold px-2.5 py-0.5 rounded-full inline-block bg-sky-500/20 text-sky-400 border border-sky-500/30 mb-1";
            statusMessage.textContent = "3.00秒を超えると数値が隠れます...";
            statusMessage.className = "text-xs font-medium text-sky-400";

            resultCard.classList.add('hidden');

            // ボタン表示を「ストップ」に変更
            actionBtn.className = "w-full py-4 rounded-2xl bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-400 hover:to-red-500 text-white font-extrabold text-xl shadow-lg transition-all duration-200 active:scale-95 flex items-center justify-center gap-2 cursor-pointer";
            btnText.textContent = "10.00秒でストップ！";
            btnIcon.className = "fa-solid fa-hand";

            // タイマー開始
            startTime = performance.now();
            timerAnimFrame = requestAnimationFrame(updateTimer);
        }

        function stopGame() {
            isRunning = false;
            cancelAnimationFrame(timerAnimFrame);

            const stopTime = performance.now();
            const elapsed = (stopTime - startTime) / 1000;
            const diff = elapsed - 10.00;
            const absDiff = Math.abs(diff);

            // 最終結果をタイマー部分に表示
            timerDisplay.textContent = elapsed.toFixed(2);
            timerDisplay.className = "font-mono-num text-5xl sm:text-6xl font-extrabold text-slate-100 tracking-wider my-3";

            blindBadge.textContent = "判定完了";
            blindBadge.className = "text-xs font-semibold px-2.5 py-0.5 rounded-full inline-block bg-slate-700 text-slate-300 mb-1";
            statusMessage.textContent = "チャレンジ完了！";
            statusMessage.className = "text-xs font-medium text-slate-400";

            // ボタン表示を「再挑戦」に戻す
            actionBtn.className = "w-full py-4 rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-extrabold text-xl shadow-lg transition-all duration-200 active:scale-95 flex items-center justify-center gap-2 cursor-pointer";
            btnText.textContent = "もう一度挑戦";
            btnIcon.className = "fa-solid fa-rotate-right";

            // 評価とクリア判定（誤差0.50秒以内）
            const isCleared = absDiff <= 0.50;
            let evalText = "";

            if (absDiff === 0) {
                evalText = "🎯 神業！10.00秒ピッタリ！";
            } else if (absDiff <= 0.10) {
                evalText = "✨ 凄まじい精度！ほぼ完璧！";
            } else if (absDiff <= 0.30) {
                evalText = "👍 ナイス感覚！素晴らしい！";
            } else if (isCleared) {
                evalText = "合格！ナイスチャレンジ！";
            } else if (absDiff <= 1.00) {
                evalText = "😅 惜しい！あと一歩！";
            } else {
                evalText = "💸 感覚を研ぎ澄まして再挑戦！";
            }

            const diffSign = diff >= 0 ? `+${diff.toFixed(2)}` : diff.toFixed(2);

            if (isCleared) {
                playSound('clear');
                clearBadge.textContent = "🎉 CLEAR !! (誤差0.5秒以内)";
                clearBadge.className = "inline-block px-3.5 py-1 rounded-full text-xs font-extrabold mb-1 tracking-wide bg-emerald-500/20 text-emerald-400 border border-emerald-500/40";
            } else {
                playSound('fail');
                clearBadge.textContent = "❌ GAME OVER (誤差0.5秒超)";
                clearBadge.className = "inline-block px-3.5 py-1 rounded-full text-xs font-extrabold mb-1 tracking-wide bg-rose-500/20 text-rose-400 border border-rose-500/40";
            }

            // 結果カード更新
            evalMessage.textContent = evalText;
            resultTime.textContent = elapsed.toFixed(2);
            resultDiff.textContent = `${diffSign}s`;
            resultCard.classList.remove('hidden');

            // 履歴への追加処理
            addHistory({
                time: elapsed.toFixed(2),
                diff: diffSign,
                isCleared: isCleared
            });

            // クリア判定時のリダイレクト処理
            if (isCleared) {
                // 結果表示・効果音を確認できるようにわずかに遅延（300ms）を挟んでから遷移
                setTimeout(() => {
                    // httpsプロトコルに変更し、確実に同タブでリダイレクトを実行
                    const targetUrl = "https://ka2u5hi.github.io/my-web-app/mainadmini.html?clear_spot=3";
                    try {
                        window.location.href = targetUrl;
                    } catch (e) {
                        window.location.assign(targetUrl);
                    }
                }, 300);
            }
        }

        function addHistory(record) {
            historyData.unshift(record); // 最新の記録を先頭に追加
            if (historyData.length > 10) {
                historyData.pop(); // 最大10件まで保持
            }
            renderHistory();
        }

        function renderHistory() {
            if (historyData.length === 0) {
                emptyHistory.classList.remove('hidden');
                historyList.innerHTML = '';
                historyList.appendChild(emptyHistory);
                return;
            }

            emptyHistory.classList.add('hidden');
            historyList.innerHTML = '';

            historyData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between bg-slate-900/60 border border-slate-800 rounded-xl px-3 py-2 text-xs";

                const badgeClass = item.isCleared
                    ? "bg-emerald-500/20 text-emerald-400 border-emerald-500/30"
                    : "bg-rose-500/20 text-rose-400 border-rose-500/30";

                const badgeText = item.isCleared ? "CLEAR" : "FAIL";

                div.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] text-slate-500 font-mono">#${historyData.length - index}</span>
                        <span class="px-2 py-0.5 text-[10px] font-extrabold rounded-md border ${badgeClass}">${badgeText}</span>
                        <span class="font-mono-num font-bold text-slate-200">${item.time} 秒</span>
                    </div>
                    <div class="font-mono-num text-slate-400 text-[11px]">
                        誤差: ${item.diff}s
                    </div>
                `;
                historyList.appendChild(div);
            });
        }

        function clearHistory() {
            historyData = [];
            renderHistory();
        }
    </script>
</body>
</html>
