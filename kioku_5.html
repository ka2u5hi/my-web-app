<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>きおくりょく の しれん</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons (アイコン表示用) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (ピクセルフォント・ドットフォント) -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'DotGothic16', monospace;
            background-color: #000;
            color: #fff;
            image-rendering: pixelated;
            user-select: none;
            touch-action: manipulation;
        }

        .font-pixel {
            font-family: 'Press Start 2P', monospace;
        }

        /* ドラクエ風ウィンドウ */
        .dq-window {
            background-color: #000;
            border: 4px solid #fff;
            border-radius: 6px;
            box-shadow: inset 0 0 0 2px #000, 0 4px 10px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .dq-button {
            background-color: #000;
            border: 2px solid #fff;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .dq-button:active {
            background-color: #222;
            transform: scale(0.96);
        }

        /* 9つのパッド */
        .pad-btn {
            transition: all 0.08s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            outline: none;
            border: 2px solid #fff;
            border-radius: 4px;
        }

        .pad-btn:active {
            transform: scale(0.95);
        }

        /* 各カラーパッド */
        .pad-0 { background: #15803d; } .pad-0.active { background: #4ade80; box-shadow: 0 0 20px #4ade80; }
        .pad-1 { background: #b91c1c; } .pad-1.active { background: #fca5a5; box-shadow: 0 0 20px #fca5a5; }
        .pad-2 { background: #a16207; } .pad-2.active { background: #fde047; box-shadow: 0 0 20px #fde047; }
        .pad-3 { background: #1d4ed8; } .pad-3.active { background: #93c5fd; box-shadow: 0 0 20px #93c5fd; }
        .pad-4 { background: #6d28d9; } .pad-4.active { background: #ddd6fe; box-shadow: 0 0 20px #ddd6fe; }
        .pad-5 { background: #0e7490; } .pad-5.active { background: #a5f3fc; box-shadow: 0 0 20px #a5f3fc; }
        .pad-6 { background: #be185d; } .pad-6.active { background: #fbcfe8; box-shadow: 0 0 20px #fbcfe8; }
        .pad-7 { background: #c2410c; } .pad-7.active { background: #fed7aa; box-shadow: 0 0 20px #fed7aa; }
        .pad-8 { background: #0f766e; } .pad-8.active { background: #99f6e4; box-shadow: 0 0 20px #99f6e4; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.3s ease-in-out; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-between">

    <!-- ヘッダー -->
    <header class="w-full max-w-sm flex justify-between items-center mb-2">
        <button onclick="backToQuest()" class="dq-button px-3 py-1.5 text-xs border-yellow-400 text-yellow-300 flex items-center gap-1 font-bold">
            ◀ ぼうけんのしょ に もどる
        </button>
        <span class="text-xs text-gray-400 font-bold">キーワード 3 の しれん</span>
    </header>

    <!-- メインコンテンツ -->
    <main class="w-full max-w-sm text-center my-auto space-y-3">
        <h1 class="text-xl font-bold text-yellow-400">きおくりょく の しれん</h1>
        <p class="text-xs text-gray-300">ひかった じゅんばんを おぼえて<br>おなじように ボタンを おせ！</p>

        <div class="dq-window p-4 flex flex-col gap-3">
            <!-- ステータス表示 -->
            <div class="flex justify-around items-center text-xs border-b border-gray-700 pb-2">
                <div>ROUND: <span id="round-display" class="text-yellow-400 font-bold">0/3</span></div>
                <div>TARGET: <span id="target-count-display" class="text-yellow-400 font-bold">3おん</span></div>
                <div>TIME: <span id="timer-text" class="text-yellow-400 font-bold">--s</span></div>
            </div>

            <!-- ステータスメッセージ -->
            <div id="status-message" class="text-xs font-bold text-yellow-300 h-5">
                「スタート」を おしてね
            </div>

            <!-- 9色のボタンデッキ -->
            <div id="game-board-wrapper" class="relative flex items-center justify-center p-2 bg-gray-950 border border-gray-800 rounded">
                <div id="game-board" class="grid grid-cols-3 gap-2 w-64 h-64"></div>

                <!-- 中央STARTボタン -->
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <button id="start-btn" class="pointer-events-auto dq-button font-bold text-xs bg-yellow-500 text-black border-yellow-300 rounded-full w-20 h-20 flex items-center justify-center shadow-lg active:scale-95">
                        スタート
                    </button>
                </div>
            </div>

            <!-- サブボタン -->
            <button id="replay-btn" disabled class="dq-button py-2 text-xs font-bold text-gray-400 border-gray-600 disabled:opacity-40">
                ↺ もういちど さいせい (1かい)
            </button>
        </div>
    </main>

    <footer class="text-[10px] text-gray-500 mt-2">
        Quest of R - Mini Game
    </footer>

    <!-- モーダルダイアログ -->
    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 opacity-0 pointer-events-none transition-all duration-200">
        <div class="dq-window w-full max-w-sm p-5 text-center space-y-3" id="modal-content">
            <h2 id="modal-title" class="text-base font-bold text-yellow-300">GAME OVER</h2>
            <div id="modal-body" class="text-xs text-gray-200 space-y-2"></div>
            <button id="modal-close-btn" class="dq-button py-2 px-4 bg-yellow-500 border-yellow-300 text-black font-bold text-xs w-full">
                OK
            </button>
        </div>
    </div>

    <script>
        function backToQuest() {
            window.location.href = "https://ka2u5hi.github.io/my-web-app/mainadmini.html";
        }

        const state = {
            sequence: [],
            userStep: 0,
            currentRound: 0,
            maxRounds: 3,
            isPlaying: false,
            isShowingSequence: false,
            padCount: 9,
            initialLength: 3,
            incrementStep: 2,
            timeLeft: 0,
            maxTime: 0,
            timerInterval: null,
            replayAvailable: true
        };

        let audioCtx = null;
        const frequencies = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33];

        const gameBoard = document.getElementById('game-board');
        const gameBoardWrapper = document.getElementById('game-board-wrapper');
        const startBtn = document.getElementById('start-btn');
        const roundDisplay = document.getElementById('round-display');
        const targetCountDisplay = document.getElementById('target-count-display');
        const statusMessage = document.getElementById('status-message');
        const replayBtn = document.getElementById('replay-btn');
        const timerText = document.getElementById('timer-text');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(padIndex, duration = 280, isError = false) {
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (isError) {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                } else {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(frequencies[padIndex] || 440, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                }
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);
                osc.start();
                osc.stop(audioCtx.currentTime + duration / 1000);
            } catch (e) {}
        }

        function renderBoard() {
            gameBoard.innerHTML = '';
            for (let i = 0; i < state.padCount; i++) {
                const pad = document.createElement('button');
                pad.dataset.pad = i;
                pad.className = `pad-btn pad-${i} cursor-pointer`;
                pad.addEventListener('pointerdown', (e) => handlePadClick(i, e));
                gameBoard.appendChild(pad);
            }
        }

        function activatePad(padIndex, duration = 300) {
            const pad = gameBoard.querySelector(`[data-pad="${padIndex}"]`);
            if (!pad) return;

            pad.classList.add('active');
            playTone(padIndex, duration);

            setTimeout(() => {
                pad.classList.remove('active');
            }, duration - 50);
        }

        function startGame() {
            initAudio();
            state.sequence = [];
            state.currentRound = 0;
            state.userStep = 0;
            state.isPlaying = true;
            stopTimer();

            startBtn.style.display = 'none';
            setStatusMessage("じゅんばんを おぼえてね！");
            nextRound();
        }

        function nextRound() {
            state.currentRound++;
            state.userStep = 0;
            state.isShowingSequence = true;
            state.replayAvailable = true;
            updateReplayBtnState();
            stopTimer();

            const addCount = (state.currentRound === 1) ? state.initialLength : state.incrementStep;
            for (let i = 0; i < addCount; i++) {
                state.sequence.push(Math.floor(Math.random() * state.padCount));
            }

            roundDisplay.textContent = `${state.currentRound}/${state.maxRounds}`;
            targetCountDisplay.textContent = `${state.sequence.length}おん`;

            setStatusMessage(`じゅんばんを さいせいちゅう...`);

            setTimeout(() => {
                playSequence();
            }, 600);
        }

        function playSequence() {
            stopTimer();
            state.isShowingSequence = true;
            updateReplayBtnState();

            let i = 0;
            const interval = setInterval(() => {
                if (i < state.sequence.length) {
                    activatePad(state.sequence[i], 600);
                    i++;
                } else {
                    clearInterval(interval);
                    state.isShowingSequence = false;
                    updateReplayBtnState();
                    setStatusMessage(`あなたの ばんです！`);
                    startTimer();
                }
            }, 750);
        }

        function replaySequence() {
            if (!state.isPlaying || state.isShowingSequence || !state.replayAvailable) return;
            state.replayAvailable = false;
            state.userStep = 0;
            updateReplayBtnState();
            setStatusMessage(`もういちど さいせいします！`);
            playSequence();
        }

        function updateReplayBtnState() {
            if (state.isPlaying && !state.isShowingSequence && state.replayAvailable) {
                replayBtn.disabled = false;
                replayBtn.className = "dq-button py-2 text-xs font-bold text-yellow-300 border-yellow-400";
            } else {
                replayBtn.disabled = true;
                replayBtn.className = "dq-button py-2 text-xs font-bold text-gray-500 border-gray-700 opacity-50";
            }
        }

        function startTimer() {
            stopTimer();
            state.maxTime = state.sequence.length * 2.5 + 4;
            state.timeLeft = state.maxTime;
            updateTimerUI();

            state.timerInterval = setInterval(() => {
                state.timeLeft -= 0.1;
                if (state.timeLeft <= 0) {
                    state.timeLeft = 0;
                    updateTimerUI();
                    stopTimer();
                    handleGameOver('timeUp');
                } else {
                    updateTimerUI();
                }
            }, 100);
        }

        function stopTimer() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
        }

        function updateTimerUI() {
            if (!state.isPlaying) {
                timerText.textContent = "--s";
                return;
            }
            timerText.textContent = `${Math.ceil(state.timeLeft)}s`;
        }

        function handlePadClick(padIndex, event) {
            if (event) event.preventDefault();
            if (!state.isPlaying || state.isShowingSequence) return;

            activatePad(padIndex, 200);

            if (padIndex === state.sequence[state.userStep]) {
                state.userStep++;
                if (state.userStep === state.sequence.length) {
                    stopTimer();
                    state.isShowingSequence = true;
                    updateReplayBtnState();

                    if (state.currentRound === state.maxRounds) {
                        handleGameClear();
                    } else {
                        setStatusMessage(`ROUND ${state.currentRound} クリア！`);
                        setTimeout(() => {
                            nextRound();
                        }, 1000);
                    }
                }
            } else {
                stopTimer();
                handleGameOver('wrongKey');
            }
        }

        function handleGameClear() {
            stopTimer();
            state.isPlaying = false;
            state.isShowingSequence = false;
            updateReplayBtnState();

            setStatusMessage("🎉 全ROUND クリア！");

            setTimeout(() => {
                window.location.href = "https://ka2u5hi.github.io/my-web-app/mainadmini.html?clear_spot=3";
            }, 1200);
        }

        function handleGameOver(reason = 'wrongKey') {
            stopTimer();
            playTone(0, 400, true);
            state.isPlaying = false;
            state.isShowingSequence = false;
            updateReplayBtnState();

            gameBoardWrapper.classList.add('shake');
            setTimeout(() => gameBoardWrapper.classList.remove('shake'), 300);

            const isTimeUp = reason === 'timeUp';
            setStatusMessage(isTimeUp ? "タイムアップ！" : "しっぱい！");

            startBtn.style.display = 'flex';

            showModal(
                isTimeUp ? "TIME UP!" : "GAME OVER",
                isTimeUp ? "じかんぎれ です！" : "じゅんばんを まちがえました！"
            );
        }

        function setStatusMessage(msg) {
            statusMessage.textContent = msg;
        }

        startBtn.addEventListener('click', startGame);
        replayBtn.addEventListener('click', replaySequence);

        function showModal(title, message) {
            modalTitle.textContent = title;
            modalBody.textContent = message;
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        modalCloseBtn.addEventListener('click', closeModal);

        window.onload = () => {
            renderBoard();
        };
    </script>
</body>
</html>
