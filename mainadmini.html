<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quest of R - ぼうけんのしょ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HTML5-QRCode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- ドット絵風フォント (DotGothic16) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'DotGothic16', monospace;
            background-color: #000000;
            color: #ffffff;
            image-rendering: pixelated;
            -webkit-tap-highlight-color: transparent;
        }

        /* ドラクエ風ウインドウ（黒背景・白縁線） */
        .dq-window {
            background-color: #000000;
            border: 4px solid #ffffff;
            border-radius: 6px;
            box-shadow: inset 0 0 0 2px #000000, 0 4px 10px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .dq-window-gold {
            background-color: #000000;
            border: 4px solid #f59e0b;
            border-radius: 6px;
            box-shadow: inset 0 0 0 2px #000000, 0 0 15px rgba(245, 158, 11, 0.4);
        }

        /* ドラクエ風ボタン */
        .dq-button {
            background-color: #000000;
            border: 3px solid #ffffff;
            border-radius: 4px;
            color: #ffffff;
            transition: all 0.1s ease;
            position: relative;
            cursor: pointer;
        }
        .dq-button:active {
            transform: scale(0.96);
            background-color: #1f2937;
        }

        /* ネオン・ゴールドグラデーション */
        .gold-text {
            color: #fbbf24;
            text-shadow: 2px 2px 0px #78350f;
        }

        /* モーダル背景 */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(2px);
        }

        /* HTML5-QRCodeのVideoを枠いっぱいにフィッティング */
        #reader video {
            object-fit: cover !important;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen pb-12 flex flex-col justify-between select-none">

    <!-- ヘッダー (ステータス表示風) -->
    <header class="sticky top-0 z-30 p-2 bg-black border-b-4 border-white">
        <div class="max-w-md mx-auto flex justify-between items-center px-2">
            <div class="flex items-center gap-2">
                <span class="text-yellow-400 text-xl font-black">▶</span>
                <div>
                    <h1 class="text-xl font-bold tracking-wider gold-text">Quest of R</h1>
                    <p class="text-[10px] text-gray-400 -mt-1">～ ぎょうせいさいの ぼうけん ～</p>
                </div>
            </div>
            <button onclick="confirmReset()" class="dq-button px-2.5 py-1 text-xs border-red-500 text-red-400 hover:bg-red-950 flex items-center gap-1">
                <i class="fa-solid fa-rotate-left text-[10px]"></i> リセット
            </button>
        </div>
    </header>

    <!-- メインエリア -->
    <main class="max-w-md mx-auto px-3 py-4 w-full space-y-4 flex-1">

        <!-- ぼうけんのしんちょく ウインドウ -->
        <section class="dq-window p-3.5">
            <div class="flex justify-between items-center mb-2 border-b-2 border-gray-700 pb-1.5">
                <span class="text-xs text-yellow-400 font-bold tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-scroll"></i> クエスト しんちょく
                </span>
                <span id="progress-text" class="text-base font-bold text-white">0 / 6</span>
            </div>

            <!-- プログレスバー（ドット調） -->
            <div class="w-full bg-gray-900 border-2 border-white h-4 rounded-none p-0.5 mb-3">
                <div id="progress-bar" class="bg-yellow-400 h-full transition-all duration-500 ease-out" style="width: 0%"></div>
            </div>

            <!-- 解読中の古代文字スロット -->
            <div class="bg-gray-950 border-2 border-gray-600 p-2.5 text-center">
                <div class="text-[11px] text-gray-300 mb-2 font-bold tracking-widest flex items-center justify-center gap-1">
                    <i class="fa-solid fa-key text-yellow-400"></i> ふっかつのじゅもん（じゅもん）
                </div>
                <div id="keyword-slots" class="flex justify-center gap-1.5 flex-wrap">
                    <!-- JSで動的生成 -->
                </div>
            </div>

            <!-- クエストコンプリート・宝箱画面 -->
            <div id="complete-banner" class="hidden mt-3 p-3 dq-window-gold text-center text-yellow-300">
                <div class="text-base font-bold gold-text mb-1 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-crown text-yellow-400"></i> ぜんぶのじゅもんが そろった！
                </div>
                <p class="text-xs leading-relaxed text-gray-200 mt-2">
                    すばらしい！ じゅもんが かんせいした！<br>
                    うけつけ（ゴール）で このがめんを みせて<br>
                    <span class="text-yellow-400 font-bold">[ たからもの（けいひん） ]</span> を てにいれよう！ 🎁
                </p>
            </div>
        </section>

        <!-- QRスキャナー（まほうのたま） -->
        <section class="dq-window p-3 flex flex-col items-center">
            <div class="w-full border-b-2 border-gray-700 pb-1.5 mb-2 flex justify-between items-center">
                <h2 class="text-xs font-bold text-yellow-400 tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-qrcode"></i> まほうのたまで QRをさがす
                </h2>
                <span id="scanner-badge" class="text-[10px] text-gray-400">かめら きどうちゅう</span>
            </div>

            <!-- スキャン枠 -->
            <div id="reader-container" class="w-full relative bg-gray-950 border-2 border-dashed border-gray-500 min-h-[220px] flex items-center justify-center overflow-hidden">
                <div id="reader" class="w-full"></div>
            </div>

            <p id="scanner-status" class="text-[11px] text-gray-400 mt-2 text-center px-1">
                こうないの QRコード（まほうじん）に かざしてください
            </p>
            <button id="retry-camera-btn" onclick="startScanner()" class="hidden mt-2 dq-button px-3 py-1 text-xs bg-yellow-600 border-yellow-300 text-black font-bold">
                <i class="fa-solid fa-camera"></i> かめらを さいきどう
            </button>
        </section>

        <!-- だいじなもの（つよさ・獲得ログ） -->
        <section class="dq-window p-3.5">
            <h2 class="text-xs font-bold text-yellow-400 mb-3 tracking-wider border-b-2 border-gray-700 pb-1 flex items-center gap-1.5">
                <i class="fa-solid fa-gem"></i> だいじなもの（キーワード）
            </h2>
            <div id="spot-list" class="grid grid-cols-2 gap-2.5">
                <!-- JSで動的生成 -->
            </div>
        </section>

    </main>

    <!-- モーダル: ドラクエ風メッセージウィンドウ -->
    <div id="custom-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop hidden">
        <div class="dq-window p-5 max-w-sm w-full text-center space-y-4 relative">
            <div id="modal-icon" class="text-3xl text-yellow-400"></div>
            <h3 id="modal-title" class="text-sm font-bold text-yellow-300"></h3>
            <p id="modal-message" class="text-xs text-white leading-relaxed text-left bg-gray-950 p-2.5 border border-gray-700 min-h-[60px]"></p>
            <div id="modal-actions" class="flex justify-center gap-2 pt-1">
                <!-- JSでボタン制御 -->
            </div>
        </div>
    </div>

    <!-- モーダル: 旅の扉（ミニゲームへの遷移） -->
    <div id="game-portal-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop hidden">
        <div class="dq-window p-5 max-w-sm w-full text-center space-y-3">
            <div>
                <span id="portal-spot-name" class="text-[10px] font-bold text-yellow-400 tracking-widest uppercase"></span>
                <h3 id="portal-title" class="text-base font-bold gold-text mt-1">たび の とびら が あらわれた！</h3>
            </div>

            <div class="py-1">
                <div class="w-12 h-12 bg-blue-950 border-2 border-cyan-400 rounded-full flex items-center justify-center mx-auto text-cyan-300 text-xl shadow-lg animate-pulse mb-2">
                    <i class="fa-solid fa-dungeon"></i>
                </div>
                <p id="portal-description" class="text-xs text-gray-200 leading-relaxed bg-gray-950 p-2 border border-gray-700"></p>
            </div>

            <!-- ボタンコンテナ（単一ボタン or 複数ゲーム選択ボタン） -->
            <div id="portal-buttons-container" class="space-y-2 pt-1">
                <!-- JSで動的生成 -->
            </div>

            <button onclick="closePortalModal()" class="w-full dq-button py-2 bg-gray-900 text-gray-300 text-xs border-gray-600 mt-2">
                あとで いどむ
            </button>
        </div>
    </div>

    <footer class="text-center py-3 text-[10px] text-gray-500 tracking-widest">
        Quest of R ✦ DRAGON QUEST STYLE QR RALLY
    </footer>

    <!-- JavaScript & レトロサウンド処理 -->
    <script>
        // --- サウンド効果 (Web Audio API でレトロ音声を生成) ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
        }

        // ドラクエ風 効果音再生
        function playSe(type) {
            try {
                initAudio();
                if (!audioCtx) return;

                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    // カーソル/決定音
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.setValueAtTime(1200, now + 0.04);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'fanfare') {
                    // 宝獲得・レベルアップ風ファンファーレ
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                    notes.forEach((freq, idx) => {
                        const subOsc = audioCtx.createOscillator();
                        const subGain = audioCtx.createGain();
                        subOsc.type = 'square';
                        subOsc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        subGain.gain.setValueAtTime(0.15, now + idx * 0.1);
                        subGain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.25);
                        subOsc.connect(subGain);
                        subGain.connect(audioCtx.destination);
                        subOsc.start(now + idx * 0.1);
                        subOsc.stop(now + idx * 0.1 + 0.25);
                    });
                } else if (type === 'error') {
                    // エラー音
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch(e) {
                console.log("Audio play error", e);
            }
        }

        // --- データ設定（複数のURLを `urls` 配列に登録可能） ---
        const spotsData = [
            {
                id: 1,
                name: "キーワード 1",
                char: "文",
                code: "SPOT_1",
                urls: [
                    { title: "8パズル のしれん", url: "https://ka2u5hi.github.io/my-web-app/8pazuru_1.html" }
                ]
            },
            {
                id: 2,
                name: "キーワード 2",
                char: "化",
                code: "SPOT_2",
                urls: [
                    { title: "ミニオセロ のしれん", url: "https://ka2u5hi.github.io/my-web-app/miniosero_2.html" }
                ]
            },
            {
                id: 3,
                name: "キーワード 3",
                char: "祭",
                code: "SPOT_3",
                urls: [
                    { title: "10秒タイマー のしれん", url: "https://ka2u5hi.github.io/my-web-app/10timer_3.html" }
                ]
            },
            {
                id: 4,
                name: "キーワード 4",
                char: "ク",
                code: "SPOT_4",
                urls: [
                    { title: "神経衰弱 のしれん", url: "https://ka2u5hi.github.io/my-web-app/memory_4.html" }
                ]
            },
            {
                id: 5,
                name: "キーワード 5",
                char: "エ",
                code: "SPOT_5",
                urls: [
                    { title: "記憶力テスト のしれん", url: "https://ka2u5hi.github.io/my-web-app/kioku_5.html" }
                ]
            },
            {
                id: 6,
                name: "キーワード 6",
                char: "スト",
                code: "SPOT_6",
                urls: [
                    { title: "一筆書き のしれん", url: "https://ka2u5hi.github.io/my-web-app/onestroke_6.html" }
                ]
            }
        ];

        let foundSpotIds = [];
        let html5QrCode = null;
        let isScannerProcessing = false;

        // 初期化
        window.onload = function() {
            loadProgress();
            checkUrlParamsForClear();
            renderSpotList();
            renderKeywordSlots();
            updateProgressUI();
            startScanner();
        };

        function saveProgress() {
            localStorage.setItem('quest_of_r_dq_progress', JSON.stringify(foundSpotIds));
        }

        function loadProgress() {
            const saved = localStorage.getItem('quest_of_r_dq_progress');
            if (saved) {
                try {
                    foundSpotIds = JSON.parse(saved);
                } catch (e) {
                    foundSpotIds = [];
                }
            }
        }

        // URLパラメータによるクリア判定 (?clear_spot=1)
        function checkUrlParamsForClear() {
            const urlParams = new URLSearchParams(window.location.search);
            const clearSpotId = parseInt(urlParams.get('clear_spot'));

            if (clearSpotId && !isNaN(clearSpotId)) {
                const spot = spotsData.find(s => s.id === clearSpotId);
                if (spot && !foundSpotIds.includes(spot.id)) {
                    foundSpotIds.push(spot.id);
                    saveProgress();
                    renderSpotList();
                    renderKeywordSlots();
                    updateProgressUI();
                    window.history.replaceState({}, document.title, window.location.pathname);
                    playSe('fanfare');

                    showCustomModal(
                        "fa-trophy",
                        "しれん クリア！",
                        `なんと！ しれんを のりこえ【 ${spot.name} 】の もじ【 ${spot.char} 】を てにいれた！`,
                        [{ text: "ぼうけんを つづける", class: "dq-button py-1.5 px-4 bg-yellow-500 text-black font-bold", action: closeModal }]
                    );
                }
            }
        }

        function confirmReset() {
            playSe('click');
            showCustomModal(
                "fa-skull",
                "ぼうけんのしょ の 消去",
                "これまでの ぼうけんの きろくが すべて きえてしまいます。 本当に リセットしますか？",
                [
                    { text: "いいえ", class: "dq-button py-1 px-3 text-white bg-gray-800", action: closeModal },
                    { text: "はい", class: "dq-button py-1 px-3 text-red-400 bg-red-950 border-red-500 font-bold", action: () => {
                        foundSpotIds = [];
                        saveProgress();
                        renderSpotList();
                        renderKeywordSlots();
                        updateProgressUI();
                        closeModal();
                    }}
                ]
            );
        }

        // キーワードスロット表示
        function renderKeywordSlots() {
            const container = document.getElementById('keyword-slots');
            if (!container) return;
            container.innerHTML = '';

            spotsData.forEach(spot => {
                const isFound = foundSpotIds.includes(spot.id);
                const slot = document.createElement('div');
                slot.className = `w-9 h-11 rounded border-2 flex items-center justify-center text-sm font-bold transition-all ${
                    isFound
                        ? 'bg-yellow-950 border-yellow-400 text-yellow-300 shadow'
                        : 'bg-black border-gray-700 text-gray-700'
                }`;
                slot.textContent = isFound ? spot.char : '？';
                container.appendChild(slot);
            });
        }

        // コレクション一覧
        function renderSpotList() {
            const listContainer = document.getElementById('spot-list');
            if (!listContainer) return;
            listContainer.innerHTML = '';

            spotsData.forEach(spot => {
                const isFound = foundSpotIds.includes(spot.id);

                const card = document.createElement('div');
                card.className = `p-2 rounded border-2 flex flex-col items-center justify-center ${
                    isFound
                        ? 'bg-gray-900 border-yellow-400 text-yellow-200'
                        : 'bg-black border-gray-800 text-gray-600'
                }`;

                card.innerHTML = `
                    <div class="w-8 h-8 rounded-full border border-gray-600 flex items-center justify-center font-bold text-xs mb-1 ${
                        isFound ? 'bg-yellow-500 text-black border-yellow-300' : 'bg-gray-950 text-gray-700'
                    }">
                        ${isFound ? spot.char : '<i class="fa-solid fa-lock"></i>'}
                    </div>
                    <span class="text-xs font-bold">${spot.name}</span>
                    <span class="text-[10px] ${isFound ? 'text-yellow-400' : 'text-gray-600'}">
                        ${isFound ? 'てに入れた' : 'みふういん'}
                    </span>
                `;

                listContainer.appendChild(card);
            });
        }

        // 進捗更新
        function updateProgressUI() {
            const total = spotsData.length;
            const count = foundSpotIds.length;
            const percent = Math.round((count / total) * 100);

            const textElem = document.getElementById('progress-text');
            const barElem = document.getElementById('progress-bar');
            if (textElem) textElem.textContent = `${count} / ${total}`;
            if (barElem) barElem.style.width = `${percent}%`;

            const completeBanner = document.getElementById('complete-banner');
            if (completeBanner) {
                if (count === total) {
                    completeBanner.classList.remove('hidden');
                } else {
                    completeBanner.classList.add('hidden');
                }
            }
        }

        // スキャン後の処理
        function handleSpotDiscovered(code) {
            if (isScannerProcessing) return;
            isScannerProcessing = true;

            const spot = spotsData.find(s => s.code === code);

            if (!spot) {
                playSe('error');
                showCustomModal(
                    "fa-circle-xmark",
                    "ふしぎな じゅもん",
                    "しかし なにも おこらなかった！ (※無効なQRコードです)",
                    [{ text: "とじる", class: "dq-button py-1 px-4 text-white bg-gray-800", action: resumeScanner }]
                );
                return;
            }

            if (foundSpotIds.includes(spot.id)) {
                playSe('click');
                showCustomModal(
                    "fa-circle-check",
                    "すでに てにいれている",
                    `【 ${spot.name} 】の もじ【 ${spot.char} 】は すでに 解読済みだ！`,
                    [{ text: "とじる", class: "dq-button py-1 px-4 text-white bg-gray-800", action: resumeScanner }]
                );
            } else {
                playSe('fanfare');
                openGamePortal(spot);
            }
        }

        // 旅の扉（ミニゲーム案内）
        function openGamePortal(spot) {
            document.getElementById('portal-spot-name').textContent = spot.name;
            document.getElementById('portal-description').textContent = `「${spot.name}」の しれんに いどみ、きーわーどの【 もじ 】を てにいれよう！`;

            const btnContainer = document.getElementById('portal-buttons-container');
            btnContainer.innerHTML = '';

            // ゲームURLが複数ある場合・単数の場合でボタンを生成
            spot.urls.forEach((game) => {
                const btn = document.createElement('button');
                btn.className = "w-full dq-button py-2.5 bg-yellow-500 text-black font-bold text-xs hover:bg-yellow-400 border-white flex items-center justify-center gap-2 mb-1.5";
                btn.innerHTML = `<i class="fa-solid fa-gamepad"></i> ${game.title} に いどむ`;
                btn.onclick = () => {
                    playSe('click');
                    // 選択したミニゲームへ直接リダイレクト（同じタブ）
                    window.location.href = game.url;
                };
                btnContainer.appendChild(btn);
            });

            document.getElementById('game-portal-modal').classList.remove('hidden');
        }

        function closePortalModal() {
            document.getElementById('game-portal-modal').classList.add('hidden');
            // ★モーダルを閉じたらスキャナーを確実に再開可能な状態に戻す
            setTimeout(() => {
                isScannerProcessing = false;
            }, 300);
        }

        // QRスキャナー起動
        function startScanner() {
            const retryBtn = document.getElementById('retry-camera-btn');
            const badgeElem = document.getElementById('scanner-badge');
            if (retryBtn) retryBtn.classList.add('hidden');
            if (badgeElem) badgeElem.textContent = "かめら きどうちゅう";

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            const config = { fps: 10, qrbox: { width: 200, height: 200 } };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                (decodedText) => {
                    handleSpotDiscovered(decodedText);
                },
                () => {}
            ).catch(err => {
                console.error("Camera error:", err);
                if (badgeElem) badgeElem.textContent = "かめら ていしちゅう";
                document.getElementById('scanner-status').textContent = "※かめらの きどうに しっぱいしました。 かめらへ の アクセスを きょかしてください。";
                if (retryBtn) retryBtn.classList.remove('hidden');
            });
        }

        function resumeScanner() {
            closeModal();
            closePortalModal();
            setTimeout(() => {
                isScannerProcessing = false;
            }, 300);
        }

        // メッセージモーダル
        function showCustomModal(iconClass, title, message, actions) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-icon').className = `fa-solid ${iconClass} text-3xl text-yellow-400`;
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;

            const actionsContainer = document.getElementById('modal-actions');
            actionsContainer.innerHTML = '';

            actions.forEach(act => {
                const btn = document.createElement('button');
                btn.className = act.class;
                btn.textContent = act.text;
                btn.onclick = () => {
                    playSe('click');
                    act.action();
                };
                actionsContainer.appendChild(btn);
            });

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
            setTimeout(() => {
                isScannerProcessing = false;
            }, 300);
        }
