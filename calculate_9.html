<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>けいさん の しれん</title>
    <!-- Tailwind CSS (スタイリング用ライブラリ) の読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ドラクエ風ドットフォント -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DotGothic16', monospace;
            background-color: #000;
            color: #fff;
            image-rendering: pixelated;
            user-select: none;
            touch-action: manipulation; /* スマホでのダブルタップ拡大を防止 */
        }

        .dq-window {
            background-color: #000;
            border: 4px solid #fff;
            border-radius: 6px;
            box-shadow: inset 0 0 0 2px #000, 0 4px 10px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .dq-button {
            background-color: #000;
            border: 2px solid #fff;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: all 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .dq-button:active {
            background-color: #222;
            transform: scale(0.96);
        }

        /* 選択肢ボタンのスタイル */
        .option-btn {
            font-family: ui-sans-serif, system-ui, sans-serif; /* 数字を見やすく標準フォントに設定 */
            background-color: #1f2937;
            color: #fff;
            border: 3px solid #fff;
            border-radius: 6px;
            box-shadow: inset -3px -3px 0px #000, inset 3px 3px 0px rgba(255, 255, 255, 0.3);
            text-shadow: 2px 2px 0px #000;
            transition: transform 0.05s ease, background-color 0.1s;
        }

        .option-btn:active {
            transform: scale(0.94);
            box-shadow: inset 2px 2px 0px #000;
        }

        /* 数字・問題文の見やすさ向上用スタイル */
        .clear-number {
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            font-weight: 800;
        }

        /* 数字入力の標準スピンボタン（上下矢印）を非表示にする設定 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-between">

    <!-- ヘッダー -->
    <header class="w-full max-w-sm flex justify-between items-center mb-2">
        <button onclick="backToQuest()" class="dq-button px-3 py-1.5 text-xs border-yellow-400 text-yellow-300 flex items-center gap-1 font-bold">
            ◀ ぼうけんのしょ に もどる
        </button>
        <span class="text-xs text-gray-400 font-bold">キーワード の しれん</span>
    </header>

    <!-- メインコンテンツ -->
    <main class="w-full max-w-sm text-center my-auto space-y-3">
        <h1 class="text-xl font-bold text-yellow-400">けいさん の しれん</h1>
        <p class="text-xs text-gray-300">30びょう いないに もんだいを とけ！<br>10てん いじょうで クリアだ！</p>

        <!-- メインウィンドウ -->
        <div class="dq-window p-4">

            <!-- スタート前の説明画面 -->
            <div id="start-screen" class="space-y-4 text-left">
                <div class="bg-gray-950 p-3 border border-gray-700 text-xs text-gray-300 space-y-1 rounded">
                    <p>・せいげんじかん: <span class="text-yellow-400 font-bold">30びょう</span></p>
                    <p>・たしざん・ひきざん・かけざん が でます</p>
                    <p>・せいかいすると <span class="text-yellow-400 font-bold">1てん</span> くわわります</p>
                    <p>・ミスは <span class="text-red-400 font-bold">3かい</span> まで！</p>
                </div>
                
                <button id="start-btn" class="dq-button w-full py-3 bg-yellow-500 border-yellow-300 text-black font-bold text-sm">
                    ▶ しれんを はじめる！
                </button>
            </div>

            <!-- ゲームプレイ画面 -->
            <div id="game-screen" class="hidden space-y-4">
                
                <!-- スコアと残り時間・ライフレコードバー -->
                <div class="flex justify-between items-center bg-gray-950 p-2 border border-gray-700 text-xs text-gray-300">
                    <div>タイム: <span id="timer" class="clear-number text-red-400 font-bold text-sm">30</span>s</div>
                    <div>ミス: <span id="mistakes" class="clear-number text-red-400 font-bold text-sm">0</span>/4</div>
                    <div>スコア: <span id="score" class="clear-number text-yellow-400 font-bold text-sm">0</span></div>
                </div>

                <!-- 計算問題表示エリア -->
                <div class="py-3">
                    <div id="question" class="clear-number text-4xl font-black text-yellow-400 tracking-wider mb-4">
                        ? + ? = ?
                    </div>

                    <!-- 4択選択肢ボタンのエリア -->
                    <div id="options-container" class="grid grid-cols-2 gap-3">
                        <!-- JSで選択肢ボタンが生成されます -->
                    </div>
                </div>

                <!-- 正解・不正解のフィードバック表示 -->
                <div id="feedback" class="h-5 font-bold text-xs"></div>
            </div>

            <!-- 結果表示画面 -->
            <div id="result-screen" class="hidden space-y-4 py-2">
                <div>
                    <h2 class="text-base text-gray-300 font-bold mb-1">けっか はっぴょう</h2>
                    <div class="text-4xl font-bold text-yellow-400 mb-2">
                        <span id="final-score">0</span> <span class="text-sm font-normal text-gray-300">てん</span>
                    </div>
                    <p id="result-message" class="text-xs text-gray-300"></p>
                </div>

                <button id="restart-btn" class="dq-button w-full py-2.5 bg-gray-900 border-gray-400 text-xs font-bold text-white">
                    ↻ もう一度 挑戦する
                </button>
            </div>

        </div>
    </main>

    <footer class="text-[10px] text-gray-500 mt-2">
        Quest of R - Mini Game
    </footer>

    <!-- ゲームロジック (JavaScript) -->
    <script>
        // --- 画面要素（DOM）の取得 ---
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const optionsContainer = document.getElementById('options-container');
        
        const timerDisplay = document.getElementById('timer');
        const mistakesDisplay = document.getElementById('mistakes');
        const scoreDisplay = document.getElementById('score');
        const questionDisplay = document.getElementById('question');
        const feedbackDisplay = document.getElementById('feedback');
        const finalScoreDisplay = document.getElementById('final-score');
        const resultMessage = document.getElementById('result-message');

        // --- ゲームのステータス変数 ---
        let score = 0;              // 現在のスコア
        let mistakes = 0;           // ミスした回数
        let timeLeft = 30;          // 残り時間（秒）
        let timerInterval = null;   // タイマーの識別子
        let currentAnswer = 0;      // 現在の問題の正解値

        function backToQuest() {
            window.location.href = "http://ka2u5hi.github.io/my-web-app/mainadmini.html";
        }

        // --- ゲーム開始処理 ---
        function startGame() {
            // 変数の初期化
            score = 0;
            mistakes = 0;
            timeLeft = 30;
            scoreDisplay.textContent = score;
            mistakesDisplay.textContent = mistakes;
            timerDisplay.textContent = timeLeft;
            feedbackDisplay.textContent = '';
            
            // 画面表示の切り替え
            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');

            // 最初の問題を生成
            generateQuestion();

            // 1秒ごとにカウントダウンするタイマーを開始
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                // 残り時間が0になったらゲーム終了
                if (timeLeft <= 0) {
                    endGame('timeup');
                }
            }, 1000);
        }

        // --- 問題と選択肢の生成処理 ---
        function generateQuestion() {
            // 演算子をランダムに選択 (+ , - , *)
            const operators = ['+', '-', '×'];
            const operator = operators[Math.floor(Math.random() * operators.length)];

            let num1, num2;

            // 演算子の種類に応じて難易度を調整
            if (operator === '+') {
                num1 = Math.floor(Math.random() * 50) + 1; // 1〜50
                num2 = Math.floor(Math.random() * 50) + 1; // 1〜50
                currentAnswer = num1 + num2;
            } else if (operator === '-') {
                // 答えがマイナスにならないよう、大きい方をnum1にする
                num1 = Math.floor(Math.random() * 50) + 10;
                num2 = Math.floor(Math.random() * num1) + 1;
                currentAnswer = num1 - num2;
            } else if (operator === '×') {
                num1 = Math.floor(Math.random() * 12) + 1; // 九九〜12程度
                num2 = Math.floor(Math.random() * 10) + 1;
                currentAnswer = num1 * num2;
            }

            // 問題文を画面に表示
            questionDisplay.textContent = `${num1} ${operator} ${num2} = ?`;

            // 選択肢（正解1個 + 誤答3個）を生成する
            generateOptions(currentAnswer);
        }

        // --- 4択選択肢の作成と表示 ---
        function generateOptions(correctAnswer) {
            const options = [correctAnswer];

            // 正解に近いダミーの選択肢を3つ作成
            while (options.length < 4) {
                // 正解の±10の範囲でランダムな数字を生成
                const offset = (Math.floor(Math.random() * 10) + 1) * (Math.random() < 0.5 ? 1 : -1);
                const dummy = correctAnswer + offset;

                // 負の数にならず、かつ重複しない場合のみ追加
                if (dummy >= 0 && !options.includes(dummy)) {
                    options.push(dummy);
                }
            }

            <!-- 選択肢の配列順序をランダムにシャッフル
            options.sort(() => Math.random() - 0.5);

            // コンテナを一度クリア
            optionsContainer.innerHTML = '';

            // ボタンを4つ作成して画面に追加
            options.forEach(optionValue => {
                const button = document.createElement('button');
                button.textContent = optionValue;
                button.className = 'option-btn py-3 px-2 text-2xl font-black';
                
                // ボタンクリック時に回答判定
                button.addEventListener('click', () => checkAnswer(optionValue));
                
                optionsContainer.appendChild(button);
            });
        }

        // --- 回答の判定処理 ---
        function checkAnswer(selectedAnswer) {
            // 正解判定
            if (selectedAnswer === currentAnswer) {
                score++;
                scoreDisplay.textContent = score;
                showFeedback('⭕ せいかい！', 'text-green-400');
            } else {
                mistakes++;
                mistakesDisplay.textContent = mistakes;
                showFeedback(`❌ ざんねん！ せいかいは ${currentAnswer}`, 'text-red-400');

                // 4回間違えたら即ゲームオーバー
                if (mistakes >= 4) {
                    endGame('gameover');
                    return;
                }
            }

            // 次の問題へ
            generateQuestion();
        }

        // --- 正解/不正解のフィードバック表示 ---
        function showFeedback(message, colorClass) {
            feedbackDisplay.textContent = message;
            feedbackDisplay.className = `h-5 font-bold text-xs ${colorClass}`;
        }

        // --- ゲーム終了処理 ---
        function endGame(reason = 'timeup') {
            // タイマー停止
            clearInterval(timerInterval);

            // 最終スコア表示
            finalScoreDisplay.textContent = score;

            const titleElement = resultScreen.querySelector('h2');

            // 10点以上獲得（かつゲームオーバーではない）場合にクリアと判定
            const isCleared = (score >= 10 && reason !== 'gameover');

            // 終了理由に応じたメッセージ設定
            if (reason === 'gameover') {
                if (titleElement) titleElement.textContent = '💀 しれん しっぱい';
                resultMessage.textContent = '4かい まちがえて しまった... もういちど ちょうせん しよう！';
            } else {
                if (isCleared) {
                    if (titleElement) titleElement.textContent = '🎉 しれん クリア！';
                    resultMessage.textContent = 'みごと けいさん の しれん を のりこえた！ ぼうけんのしょ へ もどります...';
                } else {
                    if (titleElement) titleElement.textContent = 'タイムアップ！';
                    resultMessage.textContent = 'クリアには 10てん いじょう ひつようだ！ もういちど ちょうせん しよう！';
                }
            }

            // 画面表示切り替え
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            // クリア条件達成時のリダイレクト処理
            if (isCleared) {
                setTimeout(() => {
                    window.location.href = "http://ka2u5hi.github.io/my-web-app/mainadmini.html?clear_spot=";
                }, 1200);
            }
        }

        // --- イベントリスナー ---
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
