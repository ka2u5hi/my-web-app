<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仰星祭 2026 Game Hub - 来場者ポータル</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff1f2',
              100: '#ffe4e6',
              500: '#f43f5e',
              600: '#e11d48',
              700: '#be123c',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;900&display=swap');
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
    }
    .gradient-banner {
      background: linear-gradient(135deg, #e11d48 0%, #8b5cf6 50%, #2563eb 100%);
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">

  <!-- Header Section -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-gradient-to-tr from-rose-500 to-amber-500 text-white p-2 rounded-xl shadow-md">
          <i data-lucide="gamepad-2" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="font-black text-lg sm:text-xl tracking-tight bg-gradient-to-r from-rose-600 to-purple-600 bg-clip-text text-transparent">
            仰星祭 2026 Game Hub
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">文化祭 Webゲーム体験ポータル</p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Live Status Badge -->
        <div class="hidden md:flex items-center gap-2 bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 text-xs px-3 py-1.5 rounded-full border border-emerald-200 dark:border-emerald-800">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
          <span class="font-bold">LIVE ONLINE</span>
        </div>

        <!-- Camera QR Reader Button -->
        <button onclick="openQrScannerModal()" class="px-3 py-1.5 text-xs sm:text-sm font-bold bg-rose-600 hover:bg-rose-500 text-white rounded-xl shadow transition flex items-center gap-1.5">
          <i data-lucide="qr-code" class="w-4 h-4"></i>
          <span>QRスキャン</span>
        </button>

        <!-- Dark mode toggle -->
        <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
          <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
          <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Live Announcement Ticker Banner -->
  <div id="announcementBanner" class="bg-amber-500 text-slate-950 px-4 py-2 font-medium text-xs sm:text-sm flex items-center justify-between shadow-sm transition-all duration-300">
    <div class="max-w-7xl mx-auto w-full flex items-center gap-3 overflow-hidden">
      <span class="bg-slate-950 text-amber-400 text-xs font-black px-2 py-0.5 rounded flex-shrink-0 flex items-center gap-1">
        <i data-lucide="megaphone" class="w-3.5 h-3.5"></i> お知らせ
      </span>
      <div class="truncate font-semibold" id="currentAnnouncementText">
        🎉 仰星祭へようこそ！Webゲームアトラクションを体験しよう！
      </div>
    </div>
  </div>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8">

    <!-- Hero Banner -->
    <div class="relative rounded-3xl overflow-hidden shadow-xl gradient-banner text-white p-6 sm:p-10">
      <div class="relative z-10 max-w-2xl space-y-4">
        <span class="bg-white/20 backdrop-blur-md text-white text-xs font-bold px-3 py-1 rounded-full border border-white/30 inline-block">
          全ゲーム無料で遊べる！
        </span>
        <h2 class="text-2xl sm:text-4xl font-black leading-tight tracking-tight">
          Webゲームアトラクションを<br>スマホでプレイしよう🎮
        </h2>
        <p class="text-white/90 text-sm sm:text-base">
          2Rがが制作した個性豊かなゲームが勢ぞろい！会場のQRコードを読み取るか、一覧から選んで遊ぼう！
        </p>
        <div class="pt-2">
          <button onclick="openQrScannerModal()" class="bg-white text-rose-600 hover:bg-slate-100 font-black text-sm px-5 py-2.5 rounded-2xl shadow-lg transition flex items-center gap-2">
            <i data-lucide="qr-code" class="w-5 h-5"></i> ブースのQRコードを読み取る
          </button>
        </div>
      </div>
    </div>

    <!-- Navigation View Switch Tabs -->
    <div class="border-b border-slate-200 dark:border-slate-800 flex items-center gap-4">
      <button onclick="switchView('games')" id="tabGamesBtn" class="pb-3 border-b-2 border-rose-500 text-rose-600 dark:text-rose-400 flex items-center gap-2 font-bold text-sm sm:text-base">
        <i data-lucide="gamepad-2" class="w-5 h-5"></i> ゲーム一覧
      </button>
      <button onclick="switchView('map')" id="tabMapBtn" class="pb-3 border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 flex items-center gap-2 font-bold text-sm sm:text-base">
        <i data-lucide="map" class="w-5 h-5"></i> 校内ブースマップ
      </button>
    </div>

    <!-- SECTION 1: GAMES GRID -->
    <section id="gamesSection" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6" id="publicGamesGrid">
        <!-- Dynamically populated game cards -->
      </div>
    </section>

    <!-- SECTION 2: MAP VIEW -->
    <section id="mapSection" class="space-y-6 hidden">
      <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 dark:border-slate-700 pb-4">
          <div>
            <h3 class="font-black text-xl flex items-center gap-2">
              <i data-lucide="map-pin" class="w-6 h-6 text-rose-500"></i> 校内教室配置図（全体マップ）
            </h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">校内の各棟・各フロアの教室配置図です。</p>
          </div>

          <div class="flex flex-wrap gap-2">
            <button id="bldgMainBtn" onclick="selectBuilding('main')" class="px-3 py-1.5 rounded-xl text-xs font-black bg-rose-600 text-white shadow-sm transition">本館・南実習棟</button>
            <button id="bldgLabBtn" onclick="selectBuilding('lab')" class="px-3 py-1.5 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-300 transition">実験実習棟・西</button>
            <button id="bldgNorthBtn" onclick="selectBuilding('north')" class="px-3 py-1.5 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-300 transition">北実習棟・東</button>
            <button id="bldgGymBtn" onclick="selectBuilding('gym')" class="px-3 py-1.5 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-300 transition">体育館・仰星会館</button>
          </div>
        </div>

        <div class="space-y-4">
          <h4 id="buildingTitle" class="font-extrabold text-lg text-rose-600 dark:text-rose-400">🏛️ 本館・南実習棟 配置図</h4>
          <div id="buildingLayoutContent" class="space-y-3 bg-slate-50 dark:bg-slate-900/50 p-4 rounded-2xl border border-slate-200 dark:border-slate-700/50">
            <!-- Dynamically populated map floors -->
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- MODAL: QR SCANNER -->
  <div id="qrScannerModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-3xl p-6 shadow-2xl border border-slate-700 text-slate-100 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
        <h3 class="font-bold text-base text-slate-800 dark:text-white flex items-center gap-2">
          <i data-lucide="qr-code" class="w-5 h-5 text-rose-500"></i> QRコードを読み取る
        </h3>
        <button onclick="closeQrScannerModal()" class="text-slate-400 hover:text-rose-500 transition">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <div class="space-y-3 text-center">
        <p class="text-xs text-slate-500 dark:text-slate-400">
          ブースに掲示されているゲームのQRコードをカメラにかざしてください。
        </p>

        <div id="qrReader" class="overflow-hidden rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 bg-black min-h-[250px]"></div>
      </div>

      <div class="flex justify-end pt-2">
        <button onclick="closeQrScannerModal()" class="w-full py-2.5 text-xs font-bold bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl transition">
          キャンセル
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL: GAME PLAY IFRAME -->
  <div id="gamePlayModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-2 sm:p-4 hidden">
    <div class="bg-white dark:bg-slate-900 w-full max-w-4xl h-[90vh] rounded-3xl flex flex-col overflow-hidden shadow-2xl border border-slate-700">
      <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-900">
        <div>
          <h3 class="font-black text-lg" id="modalGameTitle">ゲームタイトル</h3>
          <p class="text-xs text-slate-400" id="modalGameAuthor">ブース情報</p>
        </div>
        <div class="flex items-center gap-2">
          <a id="modalExternalLink" href="#" target="_blank" class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-white transition" title="別タブで開く">
            <i data-lucide="external-link" class="w-5 h-5"></i>
          </a>
          <button onclick="closeGameModal()" class="p-2 text-slate-400 hover:text-rose-500 transition">
            <i data-lucide="x" class="w-6 h-6"></i>
          </button>
        </div>
      </div>

      <div class="flex-1 bg-black relative">
        <iframe id="gameIframe" src="" class="w-full h-full border-0"></iframe>
      </div>

      <div class="p-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-end bg-slate-50 dark:bg-slate-900">
        <button onclick="closeGameModal()" class="px-5 py-2.5 text-xs font-bold bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl transition">
          ゲームを終了する
        </button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const DEFAULT_GAMES = [];

    let gamesData = JSON.parse(localStorage.getItem('festival_games_data')) || DEFAULT_GAMES;
    let currentBuilding = 'main';
    let html5QrCode = null;

    const CAMPUS_MAP_DATA = {
      main: {
        title: '🏛️ 本館・南実習棟 配置図',
        floors: [
          {
            floor: '4F',
            rooms: [
              { name: '視聴覚室', type: 'special' },
              { name: '研修室', type: 'special' },
              { name: '3R 教室', type: 'classroom' },
              { name: '3B 教室', type: 'classroom' },
              { name: '3E 教室', type: 'classroom' },
              { name: '3M 教室', type: 'classroom' },
              { name: '生徒会室', type: 'office' }
            ]
          },
          {
            floor: '3F',
            rooms: [
              { name: '電子基礎計測実習室（南実習棟）', type: 'lab' },
              { name: '物理室', type: 'special' },
              { name: '2R 教室', type: 'classroom' },
              { name: '2B 教室', type: 'classroom' },
              { name: '2E 教室', type: 'classroom' },
              { name: '2M 教室', type: 'classroom' },
              { name: '相談室', type: 'office' }
            ]
          },
          {
            floor: '2F',
            rooms: [
              { name: 'コンピュータ実習室（南実習棟）', type: 'lab' },
              { name: '図書室', type: 'special' },
              { name: '職員室 / 校長室', type: 'office' },
              { name: '事務室', type: 'office' },
              { name: '進路支援室', type: 'office' }
            ]
          },
          {
            floor: '1F',
            rooms: [
              { name: '自動制御実習室（南実習棟）', type: 'lab' },
              { name: '化学室', type: 'special' },
              { name: '1B 教室', type: 'classroom' },
              { name: 'K2 教室', type: 'classroom' },
              { name: 'K1 教室', type: 'classroom' },
              { name: '1E 教室', type: 'classroom' },
              { name: '保健室 / 玄関', type: 'office' }
            ]
          }
        ]
      },
      lab: {
        title: '⚙️ 実験実習棟・西実習棟 配置図',
        floors: [
          {
            floor: '4F',
            rooms: [
              { name: '電力応用実習室（西）', type: 'lab' },
              { name: '計画設計実習室（西）', type: 'lab' }
            ]
          },
          {
            floor: '3F',
            rooms: [
              { name: '電気工作工事実習室（西）', type: 'lab' },
              { name: '電子計算機実習室（西）', type: 'lab' },
              { name: '建築設計製図実習室', type: 'lab' },
              { name: '電気製図実習室', type: 'lab' },
              { name: '電子機器実習室', type: 'lab' },
              { name: '電気計測実習室', type: 'lab' }
            ]
          },
          {
            floor: '2F',
            rooms: [
              { name: '製図実習室（西）', type: 'lab' },
              { name: '試験計測実習室（西）', type: 'lab' },
              { name: '第二職員室', type: 'office' },
              { name: '工作工事実習室', type: 'lab' },
              { name: '電気機器実習室', type: 'lab' }
            ]
          },
          {
            floor: '1F',
            rooms: [
              { name: '測量実習室（西）', type: 'lab' },
              { name: '材料実習室', type: 'lab' },
              { name: '施工実習室', type: 'lab' },
              { name: '自動制御実習室', type: 'lab' },
              { name: 'デザイン実習室', type: 'lab' },
              { name: '材料試験室', type: 'lab' }
            ]
          }
        ]
      },
      north: {
        title: '🏭 北実習棟・東実習棟 配置図',
        floors: [
          {
            floor: '4F',
            rooms: [
              { name: '電子機械実習室（東実習棟）', type: 'lab' }
            ]
          },
          {
            floor: '3F',
            rooms: [
              { name: 'セミナー室', type: 'special' },
              { name: 'マルチメディア実習室', type: 'lab' },
              { name: '三次元測定室', type: 'lab' },
              { name: 'メカトロ実習室', type: 'lab' },
              { name: '原動機実習室', type: 'lab' },
              { name: '被服実習室（東）', type: 'lab' }
            ]
          },
          {
            floor: '2F',
            rooms: [
              { name: '溶接実習室', type: 'lab' },
              { name: 'フライス盤実習室', type: 'lab' },
              { name: '食物実習室（東）', type: 'lab' }
            ]
          },
          {
            floor: '1F',
            rooms: [
              { name: '建方実習室', type: 'lab' },
              { name: '木造実習室', type: 'lab' },
              { name: '鋳造実習室', type: 'lab' },
              { name: '旋盤実習室', type: 'lab' },
              { name: 'MC実習室（東）', type: 'lab' }
            ]
          }
        ]
      },
      gym: {
        title: '🏀 体育館・アリーナ・仰星会館 配置図',
        floors: [
          {
            floor: '2F',
            rooms: [
              { name: 'アリーナ（体育館）', type: 'special' },
              { name: '第一研修室（仰星会館）', type: 'special' }
            ]
          },
          {
            floor: '1F',
            rooms: [
              { name: 'トレーニングルーム / 卓球場', type: 'special' },
              { name: '剣道場 / 柔道場', type: 'special' },
              { name: '和室 / 風呂（仰星会館）', type: 'special' }
            ]
          }
        ]
      }
    };

    // BroadcastChannel for cross-tab realtime sync
    const channel = new BroadcastChannel('festival_game_hub_sync');
    channel.onmessage = (event) => {
      if (event.data.type === 'SYNC_ALL') {
        gamesData = event.data.gamesData;
        if (event.data.announcement) {
          document.getElementById('currentAnnouncementText').textContent = event.data.announcement;
        }
        renderPublicGames();
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      safeInitIcons();

      const savedAnnounce = localStorage.getItem('festival_announcement');
      if (savedAnnounce) {
        document.getElementById('currentAnnouncementText').textContent = savedAnnounce;
      }

      renderPublicGames();
      renderMap();
    });

    function safeInitIcons() {
      try {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          lucide.createIcons();
        }
      } catch (e) {
        console.warn('Lucide icon warning:', e);
      }
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    function switchView(view) {
      const gamesSec = document.getElementById('gamesSection');
      const mapSec = document.getElementById('mapSection');
      const tabGames = document.getElementById('tabGamesBtn');
      const tabMap = document.getElementById('tabMapBtn');

      if (view === 'games') {
        gamesSec.classList.remove('hidden');
        mapSec.classList.add('hidden');
        tabGames.className = "pb-3 border-b-2 border-rose-500 text-rose-600 dark:text-rose-400 flex items-center gap-2 font-bold text-sm sm:text-base";
        tabMap.className = "pb-3 border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 flex items-center gap-2 font-bold text-sm sm:text-base";
      } else {
        gamesSec.classList.add('hidden');
        mapSec.classList.remove('hidden');
        tabMap.className = "pb-3 border-b-2 border-rose-500 text-rose-600 dark:text-rose-400 flex items-center gap-2 font-bold text-sm sm:text-base";
        tabGames.className = "pb-3 border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 flex items-center gap-2 font-bold text-sm sm:text-base";
        renderMap();
      }
    }

    function selectBuilding(bldgKey) {
      currentBuilding = bldgKey;
      ['main', 'lab', 'north', 'gym'].forEach(k => {
        const btn = document.getElementById(`bldg${k[0].toUpperCase() + k.slice(1)}Btn`);
        if (btn) {
          if (k === bldgKey) {
            btn.className = "px-3 py-1.5 rounded-xl text-xs font-black bg-rose-600 text-white shadow-sm transition";
          } else {
            btn.className = "px-3 py-1.5 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-300 transition";
          }
        }
      });
      renderMap();
    }

    function renderMap() {
      const bldgData = CAMPUS_MAP_DATA[currentBuilding] || CAMPUS_MAP_DATA.main;
      document.getElementById('buildingTitle').textContent = bldgData.title;

      const container = document.getElementById('buildingLayoutContent');
      container.innerHTML = '';

      bldgData.floors.forEach(floorObj => {
        const floorRow = document.createElement('div');
        floorRow.className = "bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700/60 shadow-sm flex flex-col md:flex-row items-start md:items-center gap-3";

        let roomsHTML = floorObj.rooms.map(rm => {
          let styleClass = "bg-slate-100 dark:bg-slate-900/60 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700";
          if (rm.type === 'classroom') styleClass = "bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300 border-rose-200 dark:border-rose-900/50";
          if (rm.type === 'lab') styleClass = "bg-indigo-50 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-300 border-indigo-200 dark:border-indigo-900/50";
          if (rm.type === 'special') styleClass = "bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 border-amber-200 dark:border-amber-900/50";

          return `
            <div class="px-3 py-2 rounded-lg border text-xs font-bold whitespace-nowrap min-w-[90px] text-center ${styleClass}">
              ${rm.name}
            </div>
          `;
        }).join('');

        floorRow.innerHTML = `
          <div class="w-12 h-12 bg-rose-500 text-white font-black text-sm rounded-xl flex items-center justify-center flex-shrink-0 shadow">
            ${floorObj.floor}
          </div>
          <div class="flex flex-wrap gap-2 flex-1">
            ${roomsHTML}
          </div>
        `;

        container.appendChild(floorRow);
      });

      safeInitIcons();
    }

    function renderPublicGames() {
      const grid = document.getElementById('publicGamesGrid');
      grid.innerHTML = '';

      const activeGames = gamesData.filter(g => g.active);

      if (activeGames.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full bg-white dark:bg-slate-800 rounded-3xl p-8 border border-slate-200 dark:border-slate-700/60 text-center text-slate-400">
            現在公開中のゲームはありません。管理者ポータルからゲームを追加してください。
          </div>
        `;
        return;
      }

      activeGames.forEach(game => {
        const card = document.createElement('div');
        card.className = "bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200 dark:border-slate-700/60 shadow-sm hover:shadow-md transition-all flex flex-col justify-between group";
        card.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <span class="bg-rose-100 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 text-xs font-black px-3 py-1 rounded-full flex items-center gap-1">
                <i data-lucide="map-pin" class="w-3.5 h-3.5"></i> ${game.location}
              </span>
            </div>

            <div>
              <h4 class="font-black text-xl group-hover:text-rose-500 transition-colors flex items-center gap-2">
                ${game.title}
              </h4>
              <p class="text-xs text-slate-400 font-bold mt-0.5">${game.author}</p>
            </div>

            <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
              ${game.description}
            </p>
          </div>

          <div class="pt-5 border-t border-slate-100 dark:border-slate-700/50 mt-4 flex items-center justify-between">
            <span class="text-xs font-bold text-rose-500">🎮 ${game.plays}回 プレイ済</span>
            <button onclick="playGame('${game.id}')" class="bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition shadow-md flex items-center gap-1.5">
              <i data-lucide="play" class="w-4 h-4 fill-current"></i> プレイする
            </button>
          </div>
        `;
        grid.appendChild(card);
      });

      safeInitIcons();
    }

    function playGame(gameId) {
      const game = gamesData.find(g => g.id === gameId);
      if (!game) return;

      game.plays += 1;

      localStorage.setItem('festival_games_data', JSON.stringify(gamesData));
      const currentAnnounce = localStorage.getItem('festival_announcement') || '';
      channel.postMessage({ type: 'SYNC_ALL', gamesData, announcement: currentAnnounce });

      document.getElementById('modalGameTitle').textContent = game.title;
      document.getElementById('modalGameAuthor').textContent = `${game.author} (${game.location})`;
      document.getElementById('gameIframe').src = game.url;
      document.getElementById('modalExternalLink').href = game.url;

      document.getElementById('gamePlayModal').classList.remove('hidden');

      renderPublicGames();
    }

    function closeGameModal() {
      document.getElementById('gamePlayModal').classList.add('hidden');
      document.getElementById('gameIframe').src = '';
    }

    // --- QR CODE SCANNER FUNCTIONS ---
    function openQrScannerModal() {
      document.getElementById('qrScannerModal').classList.remove('hidden');
      safeInitIcons();

      if (typeof Html5Qrcode !== 'undefined') {
        html5QrCode = new Html5Qrcode("qrReader");
        const config = { fps: 10, qrbox: { width: 220, height: 220 } };

        html5QrCode.start(
          { facingMode: "environment" },
          config,
          onQrCodeScanned,
          (errorMessage) => {
            // Scanner frame scan error (normal ignore)
          }
        ).catch(err => {
          console.warn("Unable to start camera:", err);
          document.getElementById('qrReader').innerHTML = `
            <div class="p-6 text-xs text-rose-400 font-bold flex flex-col items-center justify-center h-full gap-2">
              <i data-lucide="camera-off" class="w-8 h-8"></i>
              カメラの起動に失敗しました。<br>ブラウザのカメラ権限を許可してください。
            </div>
          `;
          safeInitIcons();
        });
      }
    }

    function closeQrScannerModal() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          html5QrCode = null;
          document.getElementById('qrScannerModal').classList.add('hidden');
        }).catch(err => {
          document.getElementById('qrScannerModal').classList.add('hidden');
        });
      } else {
        document.getElementById('qrScannerModal').classList.add('hidden');
      }
    }

    function onQrCodeScanned(decodedText, decodedResult) {
      closeQrScannerModal();

      const matchedGame = gamesData.find(g => g.url === decodedText || decodedText.includes(g.url));

      if (matchedGame) {
        playGame(matchedGame.id);
      } else {
        document.getElementById('modalGameTitle').textContent = "QRスキャンゲーム";
        document.getElementById('modalGameAuthor').textContent = "外部読み込み";
        document.getElementById('gameIframe').src = decodedText;
        document.getElementById('modalExternalLink').href = decodedText;
        document.getElementById('gamePlayModal').classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
