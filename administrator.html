<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仰星祭 2026 Game Hub - 管理者画面</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;900&display=swap');
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur border-b border-slate-800 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-rose-600 text-white p-2 rounded-xl shadow-md">
          <i data-lucide="shield-check" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="font-black text-lg sm:text-xl tracking-tight text-white flex items-center gap-2">
            仰星祭 2026 Admin Panel
            <span class="bg-rose-500/20 text-rose-300 text-xs font-bold px-2 py-0.5 rounded-full border border-rose-500/30">管理専用</span>
          </h1>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <a href="users.html" target="_blank" class="px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition flex items-center gap-1.5 border border-slate-700">
          <i data-lucide="external-link" class="w-4 h-4"></i>
          来場者ポータルを開く
        </a>
        <button onclick="resetAllAdminData()" class="px-3 py-1.5 text-xs font-bold bg-red-500/20 hover:bg-red-500/30 text-red-300 rounded-xl transition border border-red-500/30 flex items-center gap-1" title="全データを0件にリセット">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> リセット
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- Top Admin Header Bar -->
    <div class="flex items-center justify-between gap-4">
      <h2 class="text-xl font-black text-white flex items-center gap-2">
        <i data-lucide="sliders" class="w-6 h-6 text-rose-500"></i> ゲーム・告知統括ダッシュボード
      </h2>
      <button onclick="openAddGameModal()" class="bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm px-5 py-2.5 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
        <i data-lucide="plus-circle" class="w-5 h-5"></i> 新規ゲーム登録
      </button>
    </div>

    <!-- Admin Control Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- Broadcast Controller -->
      <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700/60 shadow-sm space-y-3">
        <h3 class="font-bold text-sm flex items-center gap-2 text-white">
          <i data-lucide="megaphone" class="w-4 h-4 text-amber-400"></i> 一斉アナウンス更新
        </h3>
        <textarea id="announcementInput" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-slate-100 focus:ring-2 focus:ring-rose-500 outline-none resize-none" placeholder="ポータル上部に流すテロップ文章..."></textarea>
        <button onclick="updateAnnouncement()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs py-2 rounded-xl transition flex items-center justify-center gap-1.5">
          <i data-lucide="send" class="w-4 h-4"></i> テロップ配信
        </button>
      </div>

      <!-- Quick QR Generator Tool -->
      <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700/60 shadow-sm space-y-3">
        <h3 class="font-bold text-sm flex items-center gap-2 text-white">
          <i data-lucide="qr-code" class="w-4 h-4 text-emerald-400"></i> 即席QRコード作成
        </h3>
        <input type="url" id="quickQrUrlInput" placeholder="https://example.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:ring-2 focus:ring-emerald-500 outline-none">
        <button onclick="generateCustomQrCode()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2 rounded-xl transition flex items-center justify-center gap-1.5">
          <i data-lucide="qr-code" class="w-4 h-4"></i> QRコード生成
        </button>
      </div>

      <!-- Realtime Analytics Chart -->
      <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700/60 shadow-sm flex flex-col justify-between">
        <div class="flex items-center justify-between mb-2">
          <h3 class="font-bold text-sm flex items-center gap-2 text-white">
            <i data-lucide="bar-chart-3" class="w-4 h-4 text-purple-400"></i> プレイ数統計
          </h3>
          <span class="text-xs text-slate-400 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> リアルタイム
          </span>
        </div>
        <div class="h-32">
          <canvas id="adminAnalyticsChart"></canvas>
        </div>
      </div>

    </div>

    <!-- Registered Games Management Table -->
    <div class="bg-slate-800 rounded-2xl border border-slate-700/60 shadow-sm overflow-hidden">
      <div class="p-4 border-b border-slate-700 flex items-center justify-between">
        <h3 class="font-bold text-base text-white">登録ゲーム一覧</h3>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-900/50 text-slate-400 font-bold border-b border-slate-700 text-xs">
            <tr>
              <th class="p-3.5">ゲーム名 / 団体</th>
              <th class="p-3.5">出展場所</th>
              <th class="p-3.5">稼働状態</th>
              <th class="p-3.5">総プレイ数</th>
              <th class="p-3.5 text-right">操作</th>
            </tr>
          </thead>
          <tbody id="adminGamesTableBody" class="divide-y divide-slate-700/50">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- MODAL: QR CODE DISPLAY & PRINT -->
  <div id="qrModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-700 text-slate-100 space-y-4 text-center">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3">
        <h3 class="font-bold text-sm text-white flex items-center gap-1.5" id="qrModalTitle">
          <i data-lucide="qr-code" class="w-4 h-4 text-emerald-400"></i> QRコード表示
        </h3>
        <button onclick="closeQrModal()" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="bg-white p-4 rounded-2xl inline-block mx-auto shadow-inner">
        <div id="qrcodeCanvas"></div>
      </div>

      <p class="text-xs text-slate-400 break-all px-2" id="qrModalTargetUrl"></p>

      <div class="pt-2 flex items-center justify-center gap-2">
        <button onclick="closeQrModal()" class="px-4 py-2 text-xs font-bold bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl transition">
          閉じる
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL: ADD GAME FORM -->
  <div id="addGameModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-4 border border-slate-700 text-slate-100">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3">
        <h3 class="font-bold text-base flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-5 h-5 text-rose-500"></i> 新規Webゲーム登録
        </h3>
        <button onclick="closeAddGameModal()" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="addGameForm" onsubmit="handleAddGameSubmit(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">ゲーム名</label>
          <input type="text" id="newGameTitle" required placeholder="例: ミニオセロ" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-rose-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">出展団体・クラス名</label>
          <input type="text" id="newGameAuthor" required placeholder="例: パソコン部" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-rose-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">出展場所</label>
          <input type="text" id="newGameLocation" required placeholder="例: 2F 2-3教室" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-rose-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Webゲーム URL</label>
          <input type="url" id="newGameUrl" required placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-rose-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">説明文</label>
          <textarea id="newGameDesc" rows="2" placeholder="ゲームの概要やルール..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-rose-500 outline-none resize-none"></textarea>
        </div>

        <div class="flex items-center justify-end gap-3 pt-2">
          <button type="button" onclick="closeAddGameModal()" class="px-4 py-2 text-xs font-bold text-slate-400 hover:text-slate-200">キャンセル</button>
          <button type="submit" class="bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs px-5 py-2 rounded-xl transition">登録追加</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const DEFAULT_GAMES = [];

    let gamesData = JSON.parse(localStorage.getItem('festival_games_data')) || DEFAULT_GAMES;
    let chartInstance = null;

    // BroadcastChannel for cross-tab realtime sync
    const channel = new BroadcastChannel('festival_game_hub_sync');

    channel.onmessage = (event) => {
      if (event.data.type === 'SYNC_ALL') {
        gamesData = event.data.gamesData;
        renderAdminTable();
        updateChartData();
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      try {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          lucide.createIcons();
        }
      } catch (e) {
        console.warn('Lucide icon render warning:', e);
      }
      renderAdminTable();
      initAnalyticsChart();

      const savedAnnounce = localStorage.getItem('festival_announcement');
      if (savedAnnounce) {
        document.getElementById('announcementInput').value = savedAnnounce;
      }
    });

    function resetAllAdminData() {
      if (confirm("すべてのプレイ数・登録ゲーム・設定をリセットしますか？")) {
        localStorage.removeItem('festival_games_data');

        gamesData = [];
        localStorage.setItem('festival_games_data', JSON.stringify(gamesData));

        channel.postMessage({ type: 'SYNC_ALL', gamesData });
        renderAdminTable();
        updateChartData();
        alert("データをリセットしました！");
      }
    }

    function saveDataAndSync() {
      localStorage.setItem('festival_games_data', JSON.stringify(gamesData));
      const currentAnnounce = localStorage.getItem('festival_announcement') || '';
      channel.postMessage({
        type: 'SYNC_ALL',
        gamesData,
        announcement: currentAnnounce
      });
    }

    function updateLocation(gameId, newLoc) {
      const game = gamesData.find(g => g.id === gameId);
      if (game) {
        game.location = newLoc;
        saveDataAndSync();
      }
    }

    function renderAdminTable() {
      const tbody = document.getElementById('adminGamesTableBody');
      tbody.innerHTML = '';

      if (gamesData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-xs text-slate-400">登録されているゲームはありません。「新規ゲーム登録」ボタンからゲームを追加してください。</td></tr>`;
        return;
      }

      gamesData.forEach(game => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-700/40 transition";

        tr.innerHTML = `
          <td class="p-3.5">
            <div class="font-bold text-white text-xs">${game.title}</div>
            <div class="text-[11px] text-slate-400">${game.author}</div>
          </td>
          <td class="p-3.5">
            <input type="text" value="${game.location}" onchange="updateLocation('${game.id}', this.value)"
              class="bg-slate-900 border border-slate-700 focus:border-rose-500 rounded-lg px-2 py-1 text-xs font-semibold text-slate-200 outline-none w-36">
          </td>
          <td class="p-3.5">
            <button onclick="toggleGameActive('${game.id}')" class="px-2.5 py-1 rounded-full text-[11px] font-bold transition ${game.active ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-slate-700 text-slate-400'}">
              ${game.active ? '● 公開中' : '○ 非公開'}
            </button>
          </td>
          <td class="p-3.5 font-bold text-rose-400 text-xs">${game.plays} 回</td>
          <td class="p-3.5 text-right space-x-1">
            <button onclick="showGameQrModal('${game.id}')" class="p-1.5 text-emerald-400 hover:text-emerald-300 transition" title="QRコード作成">
              <i data-lucide="qr-code" class="w-4 h-4"></i>
            </button>
            <button onclick="deleteGame('${game.id}')" class="p-1.5 text-slate-400 hover:text-red-400 transition" title="削除">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      try {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          lucide.createIcons();
        }
      } catch (e) {
        console.warn('Lucide icon render warning:', e);
      }
    }

    function generateCustomQrCode() {
      const url = document.getElementById('quickQrUrlInput').value.trim();
      if (!url) {
        alert("URLを入力してください");
        return;
      }
      openQrModal(url, "カスタムURL QRコード");
    }

    function showGameQrModal(gameId) {
      const game = gamesData.find(g => g.id === gameId);
      if (game && game.url) {
        openQrModal(game.url, `${game.title} のQRコード`);
      }
    }

    function openQrModal(url, title) {
      document.getElementById('qrModalTitle').innerHTML = `<i data-lucide="qr-code" class="w-4 h-4 text-emerald-400"></i> ${title}`;
      document.getElementById('qrModalTargetUrl').textContent = url;

      const canvasContainer = document.getElementById('qrcodeCanvas');
      canvasContainer.innerHTML = '';

      if (typeof QRCode !== 'undefined') {
        new QRCode(canvasContainer, {
          text: url,
          width: 180,
          height: 180,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      }

      document.getElementById('qrModal').classList.remove('hidden');
      try { if (window.lucide) lucide.createIcons(); } catch(e){}
    }

    function closeQrModal() {
      document.getElementById('qrModal').classList.add('hidden');
    }

    function toggleGameActive(gameId) {
      const game = gamesData.find(g => g.id === gameId);
      if (game) {
        game.active = !game.active;
        renderAdminTable();
        saveDataAndSync();
      }
    }

    function deleteGame(gameId) {
      if (confirm("このゲーム登録を削除しますか？")) {
        gamesData = gamesData.filter(g => g.id !== gameId);
        renderAdminTable();
        updateChartData();
        saveDataAndSync();
      }
    }

    function updateAnnouncement() {
      const text = document.getElementById('announcementInput').value.trim();
      if (text) {
        localStorage.setItem('festival_announcement', text);
        saveDataAndSync();
        alert("一斉アナウンスを保存し、配信しました！");
      }
    }

    function openAddGameModal() {
      document.getElementById('addGameModal').classList.remove('hidden');
    }

    function closeAddGameModal() {
      document.getElementById('addGameModal').classList.add('hidden');
    }

    function handleAddGameSubmit(e) {
      e.preventDefault();
      const newGame = {
        id: 'game_' + Date.now(),
        title: document.getElementById('newGameTitle').value,
        author: document.getElementById('newGameAuthor').value,
        location: document.getElementById('newGameLocation').value,
        url: document.getElementById('newGameUrl').value,
        description: document.getElementById('newGameDesc').value || '体験型Webゲームアトラクション！',
        active: true,
        plays: 0,
        icon: 'gamepad-2'
      };

      gamesData.push(newGame);
      renderAdminTable();
      updateChartData();
      saveDataAndSync();
      closeAddGameModal();
      document.getElementById('addGameForm').reset();
    }

    function initAnalyticsChart() {
      const ctx = document.getElementById('adminAnalyticsChart');
      if (!ctx || typeof Chart === 'undefined') return;

      const labels = gamesData.map(g => g.title);
      const data = gamesData.map(g => g.plays);

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'プレイ回数',
            data: data,
            backgroundColor: 'rgba(244, 63, 94, 0.6)',
            borderColor: 'rgba(244, 63, 94, 1)',
            borderWidth: 1,
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            x: {
              ticks: { color: '#94a3b8', font: { size: 11 } },
              grid: { color: 'rgba(51, 65, 85, 0.3)' }
            },
            y: {
              beginAtZero: true,
              ticks: { color: '#94a3b8', precision: 0, font: { size: 11 } },
              grid: { color: 'rgba(51, 65, 85, 0.3)' }
            }
          }
        }
      });
    }

    function updateChartData() {
      if (!chartInstance) {
        initAnalyticsChart();
        return;
      }
      chartInstance.data.labels = gamesData.map(g => g.title);
      chartInstance.data.datasets[0].data = gamesData.map(g => g.plays);
      chartInstance.update();
    }
  </script>
</body>
</html>
