<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スピード計算ゲーム</title>
    <!-- Tailwind CSS (スタイリング用ライブラリ) の読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* カスタムスタイル（フォント設定と背景アニメーション） */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation; /* スマホでのダブルタップ拡大を防止 */
        }
        /* 数字入力の標準スピンボタン（上下矢印）を非表示にする設定 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- ゲームのメインコンテナ Card -->
    <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8 w-full max-w-md text-center border border-slate-200">
        
        <!-- タイトル -->
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">⚡ スピード計算ゲーム</h1>
        <p class="text-sm text-slate-500 mb-6">30秒以内にできるだけたくさんの問題を解こう！</p>

        <!-- スタート前の説明画面 -->
        <div id="start-screen" class="space-y-6">
            <div class="bg-slate-50 rounded-xl p-4 border border-slate-100 text-left text-sm text-slate-600 space-y-2">
                <p>🔹 制限時間: <strong>30秒</strong></p>
                <p>🔹 足し算・引き算・掛け算が出題されます</p>
                <p>🔹 正解すると1点加算されます</p>
            </div>
            
            <button id="start-btn" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold py-3 px-6 rounded-xl transition duration-150 shadow-md">
                ゲームスタート！
            </button>
        </div>

        <!-- ゲームプレイ画面（初期状態は隠す hidden） -->
        <div id="game-screen" class="hidden space-y-6">
            
            <!-- スコアと残り時間の表示バー -->
            <div class="flex justify-between items-center bg-slate-50 px-4 py-2 rounded-lg text-slate-700 font-semibold">
                <div>残り時間: <span id="timer" class="text-red-500 font-bold text-lg">30</span>秒</div>
                <div>スコア: <span id="score" class="text-blue-600 font-bold text-lg">0</span></div>
            </div>

            <!-- 計算問題表示エリア -->
            <div class="py-6">
                <div id="question" class="text-4xl sm:text-5xl font-extrabold text-slate-800 tracking-wider mb-6">
                    <!-- JSで問題が挿入されます (例: 5 + 3 = ?) -->
                    ? + ? = ?
                </div>

                <!-- 4択選択肢ボタンのエリア -->
                <div id="options-container" class="grid grid-cols-2 gap-3">
                    <!-- JSで選択肢ボタンが生成されます -->
                </div>
            </div>

            <!-- 正解・不正解のフィードバック表示 -->
            <div id="feedback" class="h-6 font-bold text-sm"></div>
        </div>

        <!-- 結果表示画面（初期状態は隠す hidden） -->
        <div id="result-screen" class="hidden space-y-6">
            <div class="py-4">
                <h2 class="text-xl text-slate-600 font-semibold mb-2">タイムアップ！</h2>
                <div class="text-5xl font-extrabold text-blue-600 mb-2">
                    <span id="final-score">0</span> <span class="text-2xl font-normal text-slate-600">点</span>
                </div>
                <p id="result-message" class="text-slate-500 font-medium"></p>
            </div>

            <button id="restart-btn" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold py-3 px-6 rounded-xl transition duration-150 shadow-md">
                もう一度プレイ
            </button>
        </div>

    </div>

    <!-- ゲームロジック (JavaScript) -->
    <script>
        // --- 画面要素（DOM）の取得 ---
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const optionsContainer = document.getElementById('options-container');
        
        const timerDisplay = document.getElementById('timer');
        const scoreDisplay = document.getElementById('score');
        const questionDisplay = document.getElementById('question');
        const feedbackDisplay = document.getElementById('feedback');
        const finalScoreDisplay = document.getElementById('final-score');
        const resultMessage = document.getElementById('result-message');

        // --- ゲームのステータス変数 ---
        let score = 0;              // 現在のスコア
        let timeLeft = 30;          // 残り時間（秒）
        let timerInterval = null;   // タイマーの識別子
        let currentAnswer = 0;      // 現在の問題の正解値

        // --- ゲーム開始処理 ---
        function startGame() {
            // 変数の初期化
            score = 0;
            timeLeft = 30;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            feedbackDisplay.textContent = '';
            
            // 画面表示の切り替え
            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');

            // 最初の問題を生成
            generateQuestion();

            // 1秒ごとにカウントダウンするタイマーを開始
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                // 残り時間が0になったらゲーム終了
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // --- 問題と選択肢の生成処理 ---
        function generateQuestion() {
            // 演算子をランダムに選択 (+ , - , *)
            const operators = ['+', '-', '×'];
            const operator = operators[Math.floor(Math.random() * operators.length)];

            let num1, num2;

            // 演算子の種類に応じて難易度を調整
            if (operator === '+') {
                num1 = Math.floor(Math.random() * 50) + 1; // 1〜50
                num2 = Math.floor(Math.random() * 50) + 1; // 1〜50
                currentAnswer = num1 + num2;
            } else if (operator === '-') {
                // 答えがマイナスにならないよう、大きい方をnum1にする
                num1 = Math.floor(Math.random() * 50) + 10;
                num2 = Math.floor(Math.random() * num1) + 1;
                currentAnswer = num1 - num2;
            } else if (operator === '×') {
                num1 = Math.floor(Math.random() * 12) + 1; // 九九〜12程度
                num2 = Math.floor(Math.random() * 10) + 1;
                currentAnswer = num1 * num2;
            }

            // 問題文を画面に表示
            questionDisplay.textContent = `${num1} ${operator} ${num2} = ?`;

            // 選択肢（正解1個 + 誤答3個）を生成する
            generateOptions(currentAnswer);
        }

        // --- 4択選択肢の作成と表示 ---
        function generateOptions(correctAnswer) {
            const options = [correctAnswer];

            // 正解に近いダミーの選択肢を3つ作成
            while (options.length < 4) {
                // 正解の±10の範囲でランダムな数字を生成
                const offset = (Math.floor(Math.random() * 10) + 1) * (Math.random() < 0.5 ? 1 : -1);
                const dummy = correctAnswer + offset;

                // 負の数にならず、かつ重複しない場合のみ追加
                if (dummy >= 0 && !options.includes(dummy)) {
                    options.push(dummy);
                }
            }

            // 選択肢の配列順序をランダムにシャッフル
            options.sort(() => Math.random() - 0.5);

            // コンテナを一度クリア
            optionsContainer.innerHTML = '';

            // ボタンを4つ作成して画面に追加
            options.forEach(optionValue => {
                const button = document.createElement('button');
                button.textContent = optionValue;
                button.className = 'bg-slate-100 hover:bg-blue-500 hover:text-white active:scale-95 text-slate-800 font-bold text-xl py-4 rounded-xl border border-slate-200 transition duration-150 shadow-sm';
                
                // ボタンクリック時に回答判定
                button.addEventListener('click', () => checkAnswer(optionValue));
                
                optionsContainer.appendChild(button);
            });
        }

        // --- 回答の判定処理 ---
        function checkAnswer(selectedAnswer) {
            // 正解判定
            if (selectedAnswer === currentAnswer) {
                score++;
                scoreDisplay.textContent = score;
                showFeedback('⭕ 正解！', 'text-green-500');
            } else {
                showFeedback(`❌ 残念！ 正解は ${currentAnswer}`, 'text-red-500');
            }

            // 次の問題へ
            generateQuestion();
        }

        // --- 正解/不正解のフィードバック表示 ---
        function showFeedback(message, colorClass) {
            feedbackDisplay.textContent = message;
            feedbackDisplay.className = `h-6 font-bold text-sm ${colorClass}`;
        }

        // --- ゲーム終了処理 ---
        function endGame() {
            // タイマー停止
            clearInterval(timerInterval);

            // 最終スコア表示
            finalScoreDisplay.textContent = score;

            // スコアに応じたメッセージ設定
            if (score >= 20) {
                resultMessage.textContent = '素晴らしい！計算マスターですね！ 🎉';
            } else if (score >= 10) {
                resultMessage.textContent = 'ナイスプレイ！とても素早いです！ 👍';
            } else {
                resultMessage.textContent = 'お疲れ様でした！次回はもっと高得点を目指そう！ 💪';
            }

            // 画面表示切り替え
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
        }

        // --- イベントリスナー（ボタンクリック等の処理） ---
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
