<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>カラーボール の しれん</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ドラクエ風ドットフォント (DotGothic16) -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DotGothic16', monospace;
            background-color: #000000;
            color: #ffffff;
            image-rendering: pixelated;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* ドラクエ風ウィンドウ */
        .dq-window {
            background-color: #000000;
            border: 4px solid #ffffff;
            border-radius: 6px;
            box-shadow: inset 0 0 0 2px #000000, 0 4px 10px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .dq-button {
            background-color: #000000;
            border: 2px solid #ffffff;
            border-radius: 4px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .dq-button:active {
            background-color: #222222;
            transform: scale(0.96);
        }

        /* アニメーション処理 */
        .ball {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 選択中のスタック（浮き上がる効果） */
        .stack-selected {
            border-color: #f59e0b !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
            transform: translateY(-6px);
        }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-between">

    <!-- ヘッダー -->
    <header class="w-full max-w-sm flex justify-between items-center mb-2">
        <button onclick="backToQuest()" class="dq-button px-3 py-1.5 text-xs border-yellow-400 text-yellow-300 flex items-center gap-1 font-bold">
            ◀ ぼうけんのしょ に もどる
        </button>
        <span class="text-xs text-gray-400 font-bold">キーワード 5 の しれん</span>
    </header>

    <!-- メインコンテンツ -->
    <main class="w-full max-w-sm text-center my-auto space-y-3">
        <h1 class="text-xl font-bold text-yellow-400">カラーボール の しれん</h1>
        <p class="text-xs text-gray-300">おなじ いろの たまを 1つの つぼに<br>まとめて そろえよ！</p>

        <div class="dq-window p-4">
            <!-- ゲームステータス・操作ボタン -->
            <div class="flex justify-between items-center bg-gray-950 p-2 border border-gray-700 text-xs mb-4 rounded">
                <div>てすう: <span id="move-count" class="text-yellow-400 font-bold text-sm">0</span></div>

                <div class="flex gap-1.5">
                    <button id="undo-btn" class="dq-button px-2 py-1 text-[11px] border-gray-500 text-gray-300 disabled:opacity-40" disabled>
                        ↩ 1てもどす <span id="undo-count" class="text-[9px]">(3)</span>
                    </button>
                    <button id="reset-btn" class="dq-button px-2 py-1 text-[11px] border-yellow-400 text-yellow-300 font-bold">
                        ↻ やりなおす
                    </button>
                </div>
            </div>

            <!-- スタック（つぼ）エリア -->
            <div id="game-container" class="w-full flex justify-around items-end h-56 px-1 mb-3">
                <!-- JSで動的生成 -->
            </div>

            <!-- ルールヒント -->
            <div class="text-[11px] text-gray-400 bg-gray-950 p-2.5 border border-gray-800 text-left leading-relaxed">
                💡 <strong class="text-gray-300">あそびかた:</strong><br>
                1. つぼを タップして いちばんうえの たまを えらぶ<br>
                2. うつしたい つぼを タップして たまを いれる<br>
                ※ おなじ いろの たまの うえ か、からっぽの つぼ にだけ いれられます。
            </div>

            <!-- クリアメッセージ -->
            <div id="win-message" class="hidden mt-3 p-2 bg-yellow-950 border-2 border-yellow-400 text-yellow-300 text-xs font-bold animate-pulse">
                🎉 クリア！ おめでとう！ ぼうけんのしょへ もどります...
            </div>
        </div>
    </main>

    <footer class="text-[10px] text-gray-500 mt-2">
        Quest of R - Mini Game
    </footer>

    <!-- JavaScript ロジック -->
    <script>
        const STACK_CAPACITY = 4;
        const MAX_UNDO = 3;
        const COLORS = [
            { id: 'red', bg: 'bg-red-500', border: 'border-red-300' },
            { id: 'blue', bg: 'bg-blue-500', border: 'border-blue-300' },
            { id: 'green', bg: 'bg-emerald-500', border: 'border-emerald-300' }
        ];

        let stacks = [];
        let selectedStackIndex = null;
        let moves = 0;
        let history = [];
        let undoRemaining = MAX_UNDO;
        let isCleared = false;

        const gameContainer = document.getElementById('game-container');
        const moveCountElement = document.getElementById('move-count');
        const undoBtn = document.getElementById('undo-btn');
        const undoCountElement = document.getElementById('undo-count');
        const resetBtn = document.getElementById('reset-btn');
        const winMessage = document.getElementById('win-message');

        function backToQuest() {
            window.location.href = "http://ka2u5hi.github.io/my-web-app/mainadmini.html";
        }

        window.onload = () => {
            initGame();
        };

        resetBtn.addEventListener('click', initGame);
        undoBtn.addEventListener('click', handleUndo);

        function initGame() {
            moves = 0;
            history = [];
            undoRemaining = MAX_UNDO;
            selectedStackIndex = null;
            isCleared = false;
            
            moveCountElement.textContent = '0';
            winMessage.classList.add('hidden');
            updateUndoButtonUI();

            stacks = generateSolvablePuzzle();
            render();
        }

        function updateUndoButtonUI() {
            undoCountElement.textContent = `(${undoRemaining})`;

            if (history.length > 0 && undoRemaining > 0 && !isCleared) {
                undoBtn.disabled = false;
            } else {
                undoBtn.disabled = true;
            }
        }

        function handleUndo() {
            if (history.length === 0 || undoRemaining <= 0 || isCleared) return;

            const previousState = history.pop();
            stacks = JSON.parse(JSON.stringify(previousState));

            undoRemaining--;
            moves--;
            moveCountElement.textContent = moves;
            selectedStackIndex = null;

            updateUndoButtonUI();
            render();
        }

        function generateSolvablePuzzle() {
            let allBalls = [];
            COLORS.forEach(color => {
                for (let i = 0; i < STACK_CAPACITY; i++) {
                    allBalls.push(color.id);
                }
            });

            for (let i = allBalls.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allBalls[i], allBalls[j]] = [allBalls[j], allBalls[i]];
            }

            let newStacks = [[], [], [], []];
            for (let i = 0; i < 12; i++) {
                const stackIndex = Math.floor(i / STACK_CAPACITY);
                newStacks[stackIndex].push(allBalls[i]);
            }

            if (checkWinCondition(newStacks)) {
                return generateSolvablePuzzle();
            }

            return newStacks;
        }

        function render() {
            gameContainer.innerHTML = '';

            stacks.forEach((stack, stackIndex) => {
                const stackEl = document.createElement('div');
                stackEl.className = `w-14 sm:w-16 h-48 bg-black border-2 border-white rounded-b-xl flex flex-col-reverse items-center justify-start p-1 cursor-pointer transition-all ${
                    selectedStackIndex === stackIndex ? 'stack-selected' : ''
                }`;

                stackEl.addEventListener('click', () => handleStackClick(stackIndex));

                stack.forEach((colorId, ballIndex) => {
                    const colorInfo = COLORS.find(c => c.id === colorId);
                    const ballEl = document.createElement('div');
                    
                    const isTopBall = ballIndex === stack.length - 1;
                    const isSelectedTop = selectedStackIndex === stackIndex && isTopBall;

                    ballEl.className = `w-10 h-10 sm:w-12 sm:h-12 rounded-full ${colorInfo.bg} border-2 ${colorInfo.border} shadow my-0.5 ball ${
                        isSelectedTop ? '-translate-y-2' : ''
                    }`;

                    stackEl.appendChild(ballEl);
                });

                gameContainer.appendChild(stackEl);
            });
        }

        function handleStackClick(index) {
            if (isCleared) return;

            if (selectedStackIndex === null) {
                if (stacks[index].length > 0) {
                    selectedStackIndex = index;
                    render();
                }
            } else {
                const fromIndex = selectedStackIndex;
                const toIndex = index;

                if (fromIndex === toIndex) {
                    selectedStackIndex = null;
                    render();
                    return;
                }

                if (canMove(fromIndex, toIndex)) {
                    history.push(JSON.parse(JSON.stringify(stacks)));

                    const ball = stacks[fromIndex].pop();
                    stacks[toIndex].push(ball);

                    moves++;
                    moveCountElement.textContent = moves;

                    selectedStackIndex = null;
                    
                    updateUndoButtonUI();
                    render();

                    if (checkWinCondition(stacks)) {
                        handleWin();
                    }
                } else {
                    if (stacks[toIndex].length > 0) {
                        selectedStackIndex = toIndex;
                    } else {
                        selectedStackIndex = null;
                    }
                    render();
                }
            }
        }

        function canMove(fromIndex, toIndex) {
            const fromStack = stacks[fromIndex];
            const toStack = stacks[toIndex];

            if (fromStack.length === 0) return false;
            if (toStack.length >= STACK_CAPACITY) return false;
            if (toStack.length === 0) return true;

            const topFromBall = fromStack[fromStack.length - 1];
            const topToBall = toStack[toStack.length - 1];

            return topFromBall === topToBall;
        }

        function checkWinCondition(currentStacks) {
            return currentStacks.every(stack => {
                if (stack.length === 0) return true;
                if (stack.length !== STACK_CAPACITY) return false;

                const firstColor = stack[0];
                return stack.every(ball => ball === firstColor);
            });
        }

        function handleWin() {
            isCleared = true;
            winMessage.classList.remove('hidden');
            updateUndoButtonUI();

            setTimeout(() => {
                window.location.href = "http://ka2u5hi.github.io/my-web-app/mainadmini.html?clear_spot=5";
            }, 1200);
        }
    </script>
</body>
</html>
