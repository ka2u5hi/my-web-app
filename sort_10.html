<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>カラーボール の しれん</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ドラクエ風ドットフォント (DotGothic16) -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DotGothic16', monospace;
            background-color: #000000;
            color: #ffffff;
            image-rendering: pixelated;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* ドラクエ風ウィンドウ */
        .dq-window {
            background-color: #000000;
            border: 4px solid #ffffff;
            border-radius: 6px;
            box-shadow: inset 0 0 0 2px #000000, 0 4px 10px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .dq-button {
            background-color: #000000;
            border: 2px solid #ffffff;
            border-radius: 4px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .dq-button:active {
            background-color: #222222;
            transform: scale(0.96);
        }

        /* アニメーション処理 */
        .ball {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 選択中のスタック（浮き上がる効果） */
        .stack-selected {
            border-color: #f59e0b !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
            transform: translateY(-6px);
        }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-between">

    <!-- ヘッダー -->
    <header class="w-full max-w-sm flex justify-between items-center mb-2">
        <button onclick="backToQuest()" class="dq-button px-3 py-1.5 text-xs border-yellow-400 text-yellow-300 flex items-center gap-1 font-bold">
            ◀ ぼうけんのしょ に もどる
        </button>
        <span class="text-xs text-gray-400 font-bold">キーワード 5 の しれん</span>
    </header>

    <!-- メインコンテンツ -->
    <main class="w-full max-w-sm text-center my-auto space-y-3">
        <h1 class="text-xl font-bold text-yellow-400">カラーボール の しれん</h1>
        <p class="text-xs text-gray-300">おなじ いろの たまを 1つの つぼに<br>まとめて そろえよ！</p>

        <div class="dq-window p-4">
            <!-- ゲームステータス・操作ボタン -->
            <div class="flex justify-between items-center bg-gray-950 p-2 border border-gray-700 text-xs mb-4 rounded">
                <div>てすう: <span id="move-count" class="text-yellow-400 font-bold text-sm">0</span></div>

                <div class="flex gap-1.5">
                    <button id="undo-btn" class="dq-button px-2 py-1 text-[11px] border-gray-500 text-gray-300 disabled:opacity-40" disabled>
                        ↩ 1てもどす <span id="undo-count" class="text-[9px]">(3)</span>
                    </button>
                    <button id="reset-btn" class="dq-button px-2 py-1 text-[11px] border-yellow-400 text-yellow-300 font-bold">
                        ↻ やりなおす
                    </button>
                </div>
            </div>

            <!-- スタック（つぼ）エリア -->
            <div id="game-container" class="w-full flex justify-around items-end h-56 px-1 mb-3">
                <!-- JSで動的生成 -->
            </div>

            <!-- ルールヒント -->
            <div class="text-[11px] text-gray-400 bg-gray-950 p-2.5 border border-gray-800 text-left leading-relaxed">
                💡 <strong class="text-gray-300">あそびかた:</strong><br>
                1. つぼを タップして いちばんうえの たまを えらぶ<br>
                2. うつしたい つぼを タップして たまを いれる<br>
                ※ おなじ いろの たまの うえ か、からっぽの つぼ にだけ いれられます。
            </div>

            <!-- クリアメッセージ -->
            <div id="win-message" class="hidden mt-3 p-2 bg-yellow-950 border-2 border-yellow-400 text-yellow-300 text-xs font-bold animate-pulse">
                🎉 クリア！ おめでとう！ ぼうけんのしょへ もどります...
            </div>
        </div>
    </main>

    <footer class="text-[10px] text-gray-500 mt-2">
        Quest of R - Mini Game
    </footer>

    <!-- JavaScript ロジック -->
    <script>
        // ==========================================
        // ゲーム設定・定数設定
        // ==========================================
        const STACK_CAPACITY = 4; // 筒1本の容量
        const MAX_UNDO_COUNT = 3; // 1手戻るの最大使用回数
        
        // 色の定義（ID、CSS背景色、CSS枠線色）
        const COLORS = [
            { id: 'red', bg: 'bg-red-500', border: 'border-red-300' },
            { id: 'blue', bg: 'bg-blue-500', border: 'border-blue-300' },
            { id: 'green', bg: 'bg-emerald-500', border: 'border-emerald-300' }
        ];

        // 状態変数
        let stacks = [];             // 盤面データ [[色ID,...], ...]
        let selectedStackIndex = null; // 選択中のスタックインデックス
        let moves = 0;               // 手数
        let history = [];            // 盤面の履歴保存（1手戻る用）
        let remainingUndo = MAX_UNDO_COUNT; // 残りの1手戻れる回数
        let isCleared = false;

        // DOM要素の参照
        const gameContainer = document.getElementById('game-container');
        const moveCountElement = document.getElementById('move-count');
        const undoBtn = document.getElementById('undo-btn');
        const undoCountElement = document.getElementById('undo-count');
        const resetBtn = document.getElementById('reset-btn');
        const winMessage = document.getElementById('win-message');

        function backToQuest() {
            window.location.href = "https://ka2u5hi.github.io/my-web-app/mainadmini.html";
        }

        // ==========================================
        // パズル生成ロジック（絶対に解ける保証付き + BFS自動ソルバー検証）
        // ==========================================
        function generateSolvablePuzzle() {
            let newStacks;
            let attempts = 0;

            do {
                // 1. 完成状態（3色満タン＋1空き筒）からスタート
                newStacks = [
                    ['red', 'red', 'red', 'red'],
                    ['blue', 'blue', 'blue', 'blue'],
                    ['green', 'green', 'green', 'green'],
                    []
                ];

                // 2. 逆算シャッフル（同色ルール無視でランダムに崩す）
                const SHUFFLE_MOVES = 50;
                let lastFrom = -1;
                let lastTo = -1;

                for (let i = 0; i < SHUFFLE_MOVES; i++) {
                    let validMoves = [];

                    for (let from = 0; from < 4; from++) {
                        for (let to = 0; to < 4; to++) {
                            if (from === to) continue;
                            if (from === lastTo && to === lastFrom) continue;

                            if (canMoveInShuffle(newStacks, from, to)) {
                                validMoves.push({ from, to });
                            }
                        }
                    }

                    if (validMoves.length === 0) break;

                    const randomMove = validMoves[Math.floor(Math.random() * validMoves.length)];
                    const ball = newStacks[randomMove.from].pop();
                    newStacks[randomMove.to].push(ball);

                    lastFrom = randomMove.from;
                    lastTo = randomMove.to;
                }

                attempts++;

                // 3. 盤面の検証（未シャッフルでないか、かつ解法が存在するか）
            } while ((isTooEasyOrSolved(newStacks) || !isSolvableBySolver(newStacks)) && attempts < 200);

            return newStacks;
        }

        // 逆算シャッフル用の判定（色のルールを無視して容量のみチェック）
        function canMoveInShuffle(targetStacks, fromIndex, toIndex) {
            const fromStack = targetStacks[fromIndex];
            const toStack = targetStacks[toIndex];

            if (fromStack.length === 0) return false;
            if (toStack.length >= STACK_CAPACITY) return false;

            return true;
        }

        // 盤面がシャッフルされていない／空き筒がない等の不良条件チェック
        function isTooEasyOrSolved(targetStacks) {
            if (checkWinCondition(targetStacks)) return true;

            // 開始時に必ず1つの筒が完全に空であるかを保証
            const hasEmptyStack = targetStacks.some(stack => stack.length === 0);
            if (!hasEmptyStack) return true;

            // 混ざっている筒が2つ以上あるか
            let mixedCount = 0;
            for (const stack of targetStacks) {
                if (stack.length > 1) {
                    const firstColor = stack[0];
                    const hasDifferentColor = stack.some(color => color !== firstColor);
                    if (hasDifferentColor) mixedCount++;
                }
            }
            return mixedCount < 2;
        }

        // BFS（幅優先探索）で「絶対に解ける解法が存在するか」を自動テストする処理
        function isSolvableBySolver(initialStacks) {
            const queue = [JSON.parse(JSON.stringify(initialStacks))];
            const visited = new Set();
            visited.add(JSON.stringify(initialStacks));

            let stepCount = 0;
            const MAX_SEARCH_STEPS = 800;

            while (queue.length > 0 && stepCount < MAX_SEARCH_STEPS) {
                const current = queue.shift();
                stepCount++;

                if (checkWinCondition(current)) {
                    return true;
                }

                for (let from = 0; from < 4; from++) {
                    for (let to = 0; to < 4; to++) {
                        if (from === to) continue;

                        if (canMoveToStack(current, from, to)) {
                            const nextState = JSON.parse(JSON.stringify(current));
                            const ball = nextState[from].pop();
                            nextState[to].push(ball);

                            const stateKey = JSON.stringify(nextState);
                            if (!visited.has(stateKey)) {
                                visited.add(stateKey);
                                queue.push(nextState);
                            }
                        }
                    }
                }
            }

            return false;
        }

        // プレイ中の移動ルール判定（同色の上、または空の筒にのみ置ける）
        function canMoveToStack(targetStacks, fromIndex, toIndex) {
            const fromStack = targetStacks[fromIndex];
            const toStack = targetStacks[toIndex];

            if (fromStack.length === 0) return false;
            if (toStack.length >= STACK_CAPACITY) return false;
            if (toStack.length === 0) return true;

            const topFromBall = fromStack[fromStack.length - 1];
            const topToBall = toStack[toStack.length - 1];

            return topFromBall === topToBall;
        }

        // ==========================================
        // ゲーム初期化処理
        // ==========================================
        function initGame() {
            stacks = generateSolvablePuzzle();
            selectedStackIndex = null;
            moves = 0;
            history = [];
            remainingUndo = MAX_UNDO_COUNT;
            isCleared = false;

            moveCountElement.textContent = moves;
            winMessage.classList.add('hidden');
            updateUndoButtonUI();

            render();
        }

        // ==========================================
        // 描画処理
        // ==========================================
        function render() {
            gameContainer.innerHTML = '';

            stacks.forEach((stack, stackIndex) => {
                const stackEl = document.createElement('div');
                stackEl.className = `w-14 sm:w-16 h-48 bg-black border-2 border-white rounded-b-xl flex flex-col-reverse items-center justify-start p-1 cursor-pointer transition-all ${
                    selectedStackIndex === stackIndex ? 'stack-selected' : ''
                }`;

                stackEl.addEventListener('click', () => handleStackClick(stackIndex));

                stack.forEach((colorId, ballIndex) => {
                    const colorInfo = COLORS.find(c => c.id === colorId);
                    const ballEl = document.createElement('div');
                    
                    const isTopBall = ballIndex === stack.length - 1;
                    const isSelectedTop = selectedStackIndex === stackIndex && isTopBall;

                    ballEl.className = `w-10 h-10 sm:w-12 sm:h-12 rounded-full ${colorInfo.bg} border-2 ${colorInfo.border} shadow my-0.5 ball ${
                        isSelectedTop ? '-translate-y-2' : ''
                    }`;

                    stackEl.appendChild(ballEl);
                });

                gameContainer.appendChild(stackEl);
            });
        }

        // ==========================================
        // スタックタップ時の処理
        // ==========================================
        function handleStackClick(index) {
            if (isCleared) return;

            if (selectedStackIndex === null) {
                if (stacks[index].length > 0) {
                    selectedStackIndex = index;
                    render();
                }
            } else {
                const fromIndex = selectedStackIndex;
                const toIndex = index;

                if (fromIndex === toIndex) {
                    selectedStackIndex = null;
                    render();
                    return;
                }

                if (canMoveToStack(stacks, fromIndex, toIndex)) {
                    history.push(JSON.parse(JSON.stringify(stacks)));

                    const ball = stacks[fromIndex].pop();
                    stacks[toIndex].push(ball);

                    moves++;
                    moveCountElement.textContent = moves;

                    selectedStackIndex = null;
                    
                    updateUndoButtonUI();
                    render();

                    if (checkWinCondition(stacks)) {
                        handleWin();
                    }
                } else {
                    if (stacks[toIndex].length > 0) {
                        selectedStackIndex = toIndex;
                    } else {
                        selectedStackIndex = null;
                    }
                    render();
                }
            }
        }

        // ==========================================
        // 1手戻る処理
        // ==========================================
        function undoMove() {
            if (history.length === 0 || remainingUndo <= 0 || isCleared) return;

            stacks = history.pop();
            remainingUndo--;
            moves--;

            moveCountElement.textContent = moves;
            selectedStackIndex = null;

            updateUndoButtonUI();
            render();
        }

        function updateUndoButtonUI() {
            undoCountElement.textContent = `(${remainingUndo})`;

            if (history.length > 0 && remainingUndo > 0 && !isCleared) {
                undoBtn.disabled = false;
            } else {
                undoBtn.disabled = true;
            }
        }

        // ==========================================
        // クリア判定＆処理
        // ==========================================
        function checkWinCondition(currentStacks) {
            return currentStacks.every(stack => {
                if (stack.length === 0) return true;
                if (stack.length !== STACK_CAPACITY) return false;

                const firstColor = stack[0];
                return stack.every(ball => ball === firstColor);
            });
        }

        function handleWin() {
            isCleared = true;
            winMessage.classList.remove('hidden');
            updateUndoButtonUI();

            setTimeout(() => {
                window.location.href = "https://ka2u5hi.github.io/my-web-app/mainadmini.html?clear_spot=5";
            }, 1200);
        }

        // イベントリスナー設定
        undoBtn.addEventListener('click', undoMove);
        resetBtn.addEventListener('click', initGame);

        // ゲーム開始
        window.onload = initGame;
    </script>
</body>
</html>
