<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>しんけいすいじゃく の しれん</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'DotGothic16', monospace;
      background-color: #000;
      color: #fff;
      image-rendering: pixelated;
      user-select: none;
    }

    .dq-window {
      background-color: #000;
      border: 4px solid #fff;
      border-radius: 6px;
      box-shadow: inset 0 0 0 2px #000, 0 4px 10px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .dq-button {
      background-color: #000;
      border: 2px solid #fff;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .dq-button:active {
      background-color: #222;
      transform: scale(0.96);
    }

    /* 4x4 カードグリッド */
    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      aspect-ratio: 1 / 1;
      margin-bottom: 12px;
    }

    /* カード */
    .card {
      background-color: transparent;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.4s ease;
      transform-style: preserve-3d;
      border-radius: 4px;
    }

    .card.flipped .card-inner, .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 4px;
      font-size: 1.5rem;
      font-weight: bold;
    }

    /* 裏面（閉じているとき） */
    .card-back {
      background-color: #000;
      border: 2px solid #fff;
      color: #fff;
    }

    .card-back::after {
      content: "?";
      font-size: 1rem;
      color: #9ca3af;
    }

    /* 表面（めくったとき） */
    .card-front {
      background-color: #000;
      border: 2px solid #f59e0b;
      color: #fbbf24;
      transform: rotateY(180deg);
    }

    .card.matched .card-front {
      border-color: #22c55e;
      color: #4ade80;
    }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-between">

  <!-- ヘッダー -->
  <header class="w-full max-w-sm flex justify-between items-center mb-2">
    <button onclick="backToQuest()" class="dq-button px-3 py-1.5 text-xs border-yellow-400 text-yellow-300 flex items-center gap-1 font-bold">
      ◀ ぼうけんのしょ に もどる
    </button>
    <span class="text-xs text-gray-400 font-bold">キーワード 3 の しれん</span>
  </header>

  <!-- メインコンテンツ -->
  <main class="w-full max-w-sm text-center my-auto space-y-3">
    <h1 class="text-xl font-bold text-yellow-400">しんけいすいじゃく の しれん</h1>
    <p class="text-xs text-gray-300">30ターンいない に ペアを すべて みつけよ！</p>

    <div class="dq-window p-4">
      <!-- ステータス表示 -->
      <div class="flex justify-between items-center mb-3 text-xs border-b border-gray-700 pb-2">
        <div>ターンすう: <span id="turns" class="text-yellow-400 font-bold">0</span> / <span class="text-gray-400">30</span></div>
        <div>そろったペア: <span id="pairs" class="text-yellow-400 font-bold">0</span> / 8</div>
      </div>

      <!-- 4x4 カード配置エリア -->
      <div class="game-board" id="board"></div>

      <!-- リセットボタン -->
      <button class="dq-button py-2 px-4 bg-gray-900 border-gray-400 text-xs w-full font-bold" onclick="initGame()">
        ↻ さいしょから やりなおす
      </button>

      <!-- クリアメッセージ -->
      <div id="win-message" class="hidden mt-3 p-2 bg-yellow-950 border-2 border-yellow-400 text-yellow-300 text-xs font-bold animate-pulse">
        🎉 クリア！ おめでとう！ ぼうけんのしょへ もどります...
      </div>

      <!-- ゲームオーバーメッセージ -->
      <div id="lose-message" class="hidden mt-3 p-2 bg-red-950 border-2 border-red-500 text-red-300 text-xs font-bold">
        💀 ターンオーバー... さいしょから やりなおしてね！
      </div>
    </div>
  </main>

  <footer class="text-[10px] text-gray-500 mt-2">
    Quest of R - Mini Game
  </footer>

  <script>
    const NUMBERS = ['1', '2', '3', '4', '5', '6', '7', '8'];
    const MAX_TURNS = 30; // 30ターン以内に制限を変更

    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let turns = 0;
    let matchedPairs = 0;

    function backToQuest() {
      window.location.href = "https://ka2u5hi.github.io/my-web-app/mainadmini.html";
    }

    function shuffle(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function initGame() {
      const board = document.getElementById('board');
      board.innerHTML = '';

      firstCard = null;
      secondCard = null;
      lockBoard = false;
      turns = 0;
      matchedPairs = 0;
      updateStatus();

      document.getElementById('win-message').classList.add('hidden');
      document.getElementById('lose-message').classList.add('hidden');

      const cardValues = shuffle([...NUMBERS, ...NUMBERS]);

      cardValues.forEach((num, index) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.index = index;
        card.dataset.value = num;

        card.innerHTML = `
          <div class="card-inner">
            <div class="card-back"></div>
            <div class="card-front">${num}</div>
          </div>
        `;

        card.addEventListener('click', flipCard);
        board.appendChild(card);
      });
    }

    function updateStatus() {
      const turnsElement = document.getElementById('turns');
      turnsElement.textContent = turns;
      if (turns > MAX_TURNS) {
        turnsElement.classList.remove('text-yellow-400');
        turnsElement.classList.add('text-red-500');
      } else {
        turnsElement.classList.remove('text-red-500');
        turnsElement.classList.add('text-yellow-400');
      }
      document.getElementById('pairs').textContent = matchedPairs;
    }

    function flipCard() {
      if (lockBoard) return;
      if (this === firstCard) return;
      if (this.classList.contains('flipped') || this.classList.contains('matched')) return;

      this.classList.add('flipped');

      if (!firstCard) {
        firstCard = this;
      } else {
        secondCard = this;
        turns++;
        updateStatus();
        checkMatch();
      }
    }

    function checkMatch() {
      const isMatch = firstCard.dataset.value === secondCard.dataset.value;

      if (isMatch) {
        handleMatch();
      } else {
        unflipCards();
      }
    }

    function handleMatch() {
      firstCard.classList.add('matched');
      secondCard.classList.add('matched');

      matchedPairs++;
      updateStatus();
      resetTurn();

      if (matchedPairs === NUMBERS.length) {
        if (turns <= MAX_TURNS) {
          setTimeout(handleWin, 500);
        } else {
          setTimeout(handleGameOver, 500);
        }
      }
    }

    function unflipCards() {
      lockBoard = true;

      setTimeout(() => {
        firstCard.classList.remove('flipped');
        secondCard.classList.remove('flipped');
        
        // ターン数がオーバーしているか判定
        if (turns > MAX_TURNS && matchedPairs < NUMBERS.length) {
          handleGameOver();
        } else {
          resetTurn();
        }
      }, 800);
    }

    function resetTurn() {
      firstCard = null;
      secondCard = null;
      lockBoard = false;
    }

    function handleWin() {
      document.getElementById('win-message').classList.remove('hidden');

      setTimeout(() => {
        window.location.href = "https://ka2u5hi.github.io/my-web-app/mainadmini.html?clear_spot=3";
      }, 1200);
    }

    function handleGameOver() {
      lockBoard = true;
      document.getElementById('lose-message').classList.remove('hidden');
    }

    window.onload = initGame;
  </script>
</body>
</html>
