<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4択常識クイズの試練</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- ドット絵風フォント (DotGothic16) -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DotGothic16', monospace;
            background-color: #000000;
            color: #ffffff;
            image-rendering: pixelated;
            user-select: none;
        }

        /* ドラクエ風ウィンドウ */
        .dq-window {
            background-color: #000000;
            border: 4px solid #ffffff;
            border-radius: 6px;
            box-shadow: inset 0 0 0 2px #000000, 0 4px 10px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .dq-button {
            background-color: #000000;
            border: 2px solid #ffffff;
            border-radius: 4px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .dq-button:active {
            background-color: #222222;
            transform: scale(0.96);
        }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-between">

    <!-- ヘッダー -->
    <header class="w-full max-w-sm flex justify-between items-center mb-2">
        <button onclick="backToQuest()" class="dq-button px-3 py-1.5 text-xs border-yellow-400 text-yellow-300 flex items-center gap-1 font-bold">
            ◀ 冒険の書に戻る
        </button>
        <span class="text-xs text-gray-400 font-bold">キーワード 4 の試練</span>
    </header>

    <!-- メインコンテンツエリア -->
    <main class="w-full max-w-sm text-center my-auto space-y-3">
        <h1 class="text-xl font-bold text-yellow-400">4択常識クイズの試練</h1>
        <p class="text-xs text-gray-300">全5問パーフェクトで試練クリア！</p>

        <!-- ゲームカードコンテナ -->
        <div class="dq-window p-4 text-left">
            
            <!-- 1. スタート画面 -->
            <div id="start-screen" class="text-center py-4 space-y-3">
                <div class="text-4xl mb-2">💡</div>
                <h2 class="text-base font-bold text-yellow-300">一般常識チャレンジ</h2>
                <p class="text-xs text-gray-300 leading-relaxed">
                    10問の問題の中からランダムで5問出題されます。<br>
                    全問正解で試練クリア！
                </p>
                <button id="start-btn" class="dq-button py-2.5 px-4 bg-yellow-500 border-yellow-300 text-black font-bold text-xs w-full mt-2">
                    ▶ クイズを始める
                </button>
            </div>

            <!-- 2. クイズプレイ画面 -->
            <div id="quiz-screen" class="hidden space-y-3">
                <!-- プログレスバー & 問題番号情報 -->
                <div class="border-b border-gray-700 pb-2">
                    <div class="flex justify-between items-center mb-1 text-xs">
                        <span id="question-number" class="font-bold text-yellow-400">第 1 問</span>
                        <span id="score-counter" class="text-gray-300">正解数: 0</span>
                    </div>
                    <div class="w-full bg-gray-900 border border-white h-2 rounded-none">
                        <div id="progress-bar" class="bg-yellow-400 h-full transition-all duration-300" style="width: 20%"></div>
                    </div>
                </div>

                <!-- 問題文 -->
                <h2 id="question-text" class="text-xs font-bold text-white leading-relaxed min-h-[2.5rem]">
                    ここに問題文が表示されます
                </h2>

                <!-- 選択肢ボタン領域 -->
                <div id="options-container" class="space-y-2"></div>

                <!-- 次へ移動ボタン領域 -->
                <div class="mt-4 text-right">
                    <button id="next-btn" class="hidden dq-button bg-yellow-500 border-yellow-300 text-black font-bold py-1.5 px-4 text-xs">
                        次の問題へ ▶
                    </button>
                </div>
            </div>

            <!-- 3. 結果発表画面 -->
            <div id="result-screen" class="hidden text-center py-4 space-y-3">
                <h2 id="result-title" class="text-xl font-bold">結果発表</h2>
                
                <p id="score-text" class="text-xs text-gray-200"></p>
                
                <div id="rank-badge" class="my-2"></div>

                <!-- リトライボタン -->
                <button id="restart-btn" class="dq-button w-full py-2.5 px-4 bg-gray-900 border-gray-400 text-xs font-bold text-white">
                    ↻ もう一度挑戦する
                </button>
            </div>

        </div>
    </main>

    <footer class="text-[10px] text-gray-500 mt-2">
        Quest of R - Mini Game
    </footer>

    <!-- JavaScriptロジック -->
    <script>
        function backToQuest() {
            window.location.href = "https://ka2u5hi.github.io/my-web-app/mainadmini.html";
        }

        // クイズ問題データ（漢字・分かりやすいテキストに改訂）
        const quizDataPool = [
            {
                question: "工業高校などで取得が推進されている、資格や検定の取得実績に応じて生徒を表彰する制度はどれ？",
                options: ["ジュニアマイスター", "ITパスポート", "技能検定1級", "全国工業マスター"],
                answer: 0
            },
            {
                question: "日本で一番高い山は「富士山」ですが、2番目に高い山はどれ？",
                options: ["槍ヶ岳（やりがたけ）", "北岳（きたくだけ）", "奥穂高岳（おくほたかだけ）", "富士山"],
                answer: 1
            },
            {
                question: "太陽系の中で最も大きい惑星はどれ？",
                options: ["火星", "土星", "木星", "海王星"],
                answer: 2
            },
            {
                question: "ことわざ「猿も木から落ちる」と同じ意味を持つことわざはどれ？",
                options: ["犬も歩けば棒に当たる", "弘法にも筆の誤り", "石の上にも三年", "花より団子"],
                answer: 1
            },
            {
                question: "元素記号「Fe」が表す金属元素はどれ？",
                options: ["銅", "銀", "鉄", "金"],
                answer: 2
            },
            {
                question: "専門的な技術を学び、モノづくりやテクノロジー分野の即戦力を育てる高等学校の種類はどれ？",
                options: ["商業高校", "農業高校", "工業高校", "水産高校"],
                answer: 2
            },
            {
                question: "「光合成」を行う際に、植物が吸収する気体はどれ？",
                options: ["酸素", "窒素", "二酸化炭素", "水素"],
                answer: 2
            },
            {
                question: "y = ax² のように、yがxの2乗に比例するような関数を何という？",
                options: ["一次関数", "三角関数", "二次関数", "指数関数"],
                answer: 2
            },
            {
                question: "直角三角形において、斜辺の2乗が他の2辺の2乗の和に等しいという定理はどれ？",
                options: ["三平方の定理", "テーゼの定理", "二項定理", "フェルマーの最終定理"],
                answer: 0
            },
            {
                question: "1年は通常365日ですが、うるう年（閏年）は1年が何日になる？",
                options: ["364日", "365日", "366日", "367日"],
                answer: 2
            }
        ];

        const QUESTIONS_PER_GAME = 5;

        let activeQuizData = [];
        let currentQuestionIndex = 0;
        let score = 0;

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');

        const startBtn = document.getElementById('start-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');

        const questionNumber = document.getElementById('question-number');
        const scoreCounter = document.getElementById('score-counter');
        const progressBar = document.getElementById('progress-bar');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');

        const resultTitle = document.getElementById('result-title');
        const scoreText = document.getElementById('score-text');
        const rankText = document.getElementById('rank-badge');

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function startGame() {
            activeQuizData = shuffleArray(quizDataPool).slice(0, QUESTIONS_PER_GAME);
            currentQuestionIndex = 0;
            score = 0;

            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            loadQuestion();
        }

        function loadQuestion() {
            const currentQuiz = activeQuizData[currentQuestionIndex];
            
            questionNumber.textContent = `第 ${currentQuestionIndex + 1} 問 / 全 ${QUESTIONS_PER_GAME} 問`;
            scoreCounter.textContent = `正解数: ${score}`;
            progressBar.style.width = `${((currentQuestionIndex + 1) / QUESTIONS_PER_GAME) * 100}%`;

            questionText.textContent = currentQuiz.question;

            optionsContainer.innerHTML = '';
            nextBtn.classList.add('hidden');

            currentQuiz.options.forEach((optionText, index) => {
                const button = document.createElement('button');
                button.className = `w-full text-left p-2.5 text-xs dq-button border-gray-600 hover:border-yellow-400 flex items-center justify-between group`;
                
                button.innerHTML = `
                    <span>${index + 1}. ${optionText}</span>
                    <span class="text-xs text-gray-500 group-hover:text-yellow-400">▶</span>
                `;

                button.addEventListener('click', () => selectAnswer(index, button));
                optionsContainer.appendChild(button);
            });
        }

        function selectAnswer(selectedIndex, selectedButton) {
            const currentQuiz = activeQuizData[currentQuestionIndex];
            const allButtons = optionsContainer.querySelectorAll('button');

            allButtons.forEach(btn => btn.disabled = true);

            if (selectedIndex === currentQuiz.answer) {
                score++;
                selectedButton.className = "w-full text-left p-2.5 text-xs dq-button border-green-400 bg-green-950 text-green-300 font-bold flex items-center justify-between";
                selectedButton.querySelector('span:last-child').innerHTML = "✓ 正解";
            } else {
                selectedButton.className = "w-full text-left p-2.5 text-xs dq-button border-red-500 bg-red-950 text-red-300 font-bold flex items-center justify-between";
                selectedButton.querySelector('span:last-child').innerHTML = "✕ 不正解";

                const correctButton = allButtons[currentQuiz.answer];
                correctButton.className = "w-full text-left p-2.5 text-xs dq-button border-green-400 bg-green-950 text-green-300 font-bold flex items-center justify-between";
            }

            nextBtn.classList.remove('hidden');
        }

        function showResult() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            const isClear = (score === QUESTIONS_PER_GAME);

            if (isClear) {
                resultTitle.textContent = "🎉 試練クリア！ 🎉";
                resultTitle.className = "text-lg font-bold text-yellow-300 animate-pulse";
                
                scoreText.innerHTML = `パーフェクト達成！<br><span class="text-2xl font-bold text-yellow-400 my-1 inline-block">${score} / ${QUESTIONS_PER_GAME}</span> 正解`;
                rankText.textContent = "評価: Sランク (完全制覇)";
                rankText.className = "inline-block px-3 py-1 bg-yellow-950 border border-yellow-400 text-yellow-300 font-bold text-xs";

                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }

                setTimeout(function() {
                    window.location.href = "https://ka2u5hi.github.io/my-web-app/mainadmini.html?clear_spot=4";
                }, 1500);

            } else {
                resultTitle.textContent = "💀 試練失敗 💀";
                resultTitle.className = "text-lg font-bold text-red-500";
                
                scoreText.innerHTML = `<span class="text-2xl font-bold text-gray-300 my-1 inline-block">${score} / ${QUESTIONS_PER_GAME}</span> 正解`;
                
                if (score >= 3) {
                    rankText.textContent = "評価: Aランク (あと少し！)";
                    rankText.className = "inline-block px-3 py-1 bg-gray-900 border border-gray-500 text-gray-300 font-bold text-xs";
                } else {
                    rankText.textContent = "評価: Bランク (もう一度挑戦！)";
                    rankText.className = "inline-block px-3 py-1 bg-gray-900 border border-gray-700 text-gray-400 font-bold text-xs";
                }
            }
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < QUESTIONS_PER_GAME) {
                loadQuestion();
            } else {
                showResult();
            }
        });
    </script>
</body>
</html>
